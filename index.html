<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="referrer"
    content="strict-origin-when-cross-origin"
>

<title>अटल जिम</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #050505;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================================
   BACKGROUND
========================================================= */

.background {

    position: fixed;

    inset: -5%;

    width: 110%;
    height: 110%;

    z-index: 0;

    background-image:

        linear-gradient(
            rgba(0,0,0,0.04),
            rgba(0,0,0,0.25)
        ),

        url("assets/gym-sidhu.png");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    animation:
        backgroundZoom
        24s
        ease-in-out
        infinite
        alternate;
}


@keyframes backgroundZoom {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.035);
    }

    100% {
        transform: scale(1.075);
    }

}


/* =========================================================
   OVERLAY
========================================================= */

.overlay {

    position: fixed;

    inset: 0;

    z-index: 1;

    pointer-events: none;

    background:

        linear-gradient(
            180deg,
            rgba(0,0,0,0.03),
            transparent 45%,
            rgba(0,0,0,0.25)
        );
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar {

    position: fixed;

    top: 28px;

    left: 30px;

    right: 30px;

    z-index: 30;

    display: flex;

    align-items: center;

    justify-content: space-between;

    font-size: 16px;

    font-weight: 700;

    text-shadow:
        0 2px 10px
        rgba(0,0,0,0.85);
}


.online {

    position: absolute;

    left: 50%;

    transform:
        translateX(-50%);

    display: flex;

    align-items: center;

    gap: 9px;

    white-space: nowrap;
}


.online-dot {

    width: 11px;

    height: 11px;

    border-radius: 50%;

    background: #5df58e;

    box-shadow:
        0 0 14px
        rgba(93,245,142,0.9);
}


.top-right {

    display: flex;

    align-items: center;

    gap: 24px;
}


.top-link {

    display: flex;

    align-items: center;

    gap: 8px;

    cursor: pointer;

    opacity: 0.9;

    transition:
        opacity .15s ease;
}


.top-link:hover {
    opacity: 1;
}


.icon-circle {

    width: 27px;

    height: 27px;

    border:
        1px solid
        rgba(255,255,255,.7);

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 11px;
}


/* =========================================================
   CENTER LOGO
========================================================= */

.logo {

    position: fixed;

    z-index: 10;

    left: 50%;

    top: 47%;

    /*
       Previously:
       min(650px, 58vw)

       Now approximately 50%
    */

    width:
        min(325px, 29vw);

    transform:
        translate(-50%, -50%);

    pointer-events: none;

    filter:
        drop-shadow(
            0 12px 25px
            rgba(0,0,0,.35)
        );
}


.logo img {

    width: 100%;

    height: auto;

    display: block;
}


/* =========================================================
   SIDE NAVIGATION
========================================================= */

.side-button {

    position: fixed;

    top: 50%;

    z-index: 25;

    width: 48px;

    height: 48px;

    transform:
        translateY(-50%);

    border:
        1px solid
        rgba(255,255,255,.20);

    border-radius: 50%;

    background:
        rgba(25,20,18,.25);

    backdrop-filter:
        blur(8px);

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 29px;

    cursor: pointer;

    transition:
        transform .1s ease,
        background .1s ease;
}


.side-button:hover {

    background:
        rgba(25,20,18,.5);

    transform:
        translateY(-50%)
        scale(1.05);
}


.side-button:active {

    transform:
        translateY(-50%)
        scale(.88);
}


#previousSide {
    left: 28px;
}


#nextSide {
    right: 28px;
}


/* =========================================================
   MUSIC PLAYER
========================================================= */

.player {

    position: fixed;

    z-index: 50;

    left: 50%;

    bottom: 52px;

    transform:
        translateX(-50%);

    width:
        min(650px, calc(100vw - 100px));

    height: 94px;

    padding:
        10px 14px;

    border-radius: 50px;

    background:

        linear-gradient(
            135deg,
            rgba(120,45,35,.96),
            rgba(94,30,23,.96)
        );

    box-shadow:

        0 20px 55px
        rgba(0,0,0,.55),

        inset
        0 1px
        rgba(255,255,255,.12);

    display: grid;

    grid-template-columns:
        62px
        minmax(0,1fr)
        112px;

    grid-template-rows:
        1fr
        22px;

    column-gap: 13px;

    align-items: center;
}


/* =========================================================
   COVER
========================================================= */

.cover {

    width: 62px;

    height: 62px;

    grid-row:
        1 / 3;

    border-radius: 50%;

    overflow: hidden;

    background:
        #24100d;

    box-shadow:
        0 6px 20px
        rgba(0,0,0,.4);
}


.cover img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;
}


/* =========================================================
   SONG INFORMATION
========================================================= */

.song-info {

    min-width: 0;

    align-self:
        center;
}


.song-title {

    font-size: 17px;

    line-height: 1.25;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.song-artist {

    margin-top: 5px;

    font-size: 13px;

    color:
        rgba(255,255,255,.70);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================================================
   CONTROLS
========================================================= */

.controls {

    grid-column: 3;

    grid-row: 1 / 3;

    display: flex;

    align-items: center;

    justify-content: flex-end;

    gap: 12px;
}


.control-button {

    width: 24px;

    height: 32px;

    padding: 0;

    border: none;

    background: transparent;

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    font-size: 14px;

    opacity: .85;

    transition:
        transform .08s ease,
        opacity .08s ease;
}


.control-button:hover {
    opacity: 1;
}


.control-button:active {

    transform:
        scale(.75);
}


/* =========================================================
   PLAY BUTTON
========================================================= */

.play-button {

    width: 48px;

    height: 48px;

    padding: 0;

    border: none;

    border-radius: 50%;

    background: white;

    color: #17151a;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    font-size: 18px;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.2);

    transition:
        transform .08s ease;
}


.play-button:hover {

    transform:
        scale(1.04);
}


.play-button:active {

    transform:
        scale(.86);
}


/* =========================================================
   PROGRESS
========================================================= */

.progress-area {

    grid-column:
        2;

    grid-row:
        2;

    display: grid;

    grid-template-columns:
        30px
        minmax(0,1fr)
        35px;

    align-items: center;

    gap: 7px;
}


.time {

    font-size: 10px;

    color:
        rgba(255,255,255,.72);
}


.progress {

    width: 100%;

    height: 4px;

    appearance: none;

    border: none;

    border-radius: 10px;

    background:
        rgba(255,255,255,.30);

    cursor: pointer;
}


.progress::-webkit-slider-thumb {

    appearance: none;

    width: 8px;

    height: 8px;

    border: none;

    border-radius: 50%;

    background: white;
}


.progress::-moz-range-thumb {

    width: 8px;

    height: 8px;

    border: none;

    border-radius: 50%;

    background: white;
}


/* =========================================================
   MENU BUTTON
========================================================= */

.menu-button {

    position: absolute;

    right: -52px;

    top: 50%;

    transform:
        translateY(-50%);

    width: 42px;

    height: 42px;

    border:
        1px solid
        rgba(255,255,255,.22);

    border-radius: 50%;

    background:
        rgba(20,15,13,.30);

    color: white;

    font-size: 17px;

    cursor: pointer;
}


.menu-button:hover {

    background:
        rgba(20,15,13,.55);
}


/* =========================================================
   YOUTUBE PLAYLIST PANEL
========================================================= */

.playlist-panel {

    position: fixed;

    z-index: 45;

    right: 35px;

    bottom: 165px;

    width: 350px;

    max-height: 390px;

    padding: 20px;

    border-radius: 18px;

    background:
        rgba(18,14,12,.94);

    border:
        1px solid
        rgba(255,255,255,.12);

    backdrop-filter:
        blur(18px);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.6);

    opacity: 0;

    visibility: hidden;

    transform:
        translateY(12px);

    transition:
        opacity .15s ease,
        transform .15s ease,
        visibility .15s ease;
}


.playlist-panel.open {

    opacity: 1;

    visibility: visible;

    transform:
        translateY(0);
}


.playlist-title {

    font-size: 12px;

    letter-spacing:
        .14em;

    color:
        rgba(255,255,255,.55);

    margin-bottom: 14px;
}


.playlist-info {

    font-size: 12px;

    line-height: 1.7;

    color:
        rgba(255,255,255,.65);
}


/* =========================================================
   SPOTIFY PANEL
========================================================= */

.spotify-panel {

    position: fixed;

    z-index: 46;

    right: 35px;

    bottom: 165px;

    width: 350px;

    height: 390px;

    padding: 18px;

    border-radius: 18px;

    background:
        rgba(18,14,12,.96);

    border:
        1px solid
        rgba(255,255,255,.12);

    backdrop-filter:
        blur(18px);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.6);

    opacity: 0;

    visibility: hidden;

    transform:
        translateY(12px);

    transition:
        opacity .15s ease,
        transform .15s ease,
        visibility .15s ease;
}


.spotify-panel.open {

    opacity: 1;

    visibility: visible;

    transform:
        translateY(0);
}


.spotify-title {

    font-size: 12px;

    letter-spacing:
        .14em;

    color:
        rgba(255,255,255,.55);

    margin-bottom: 12px;
}


.spotify-panel iframe {

    display: block;

    width: 100%;

    height: 340px;

    border: none;

    border-radius: 12px;
}


/* =========================================================
   STATUS
========================================================= */

.status {

    position: fixed;

    left: 50%;

    top: 70%;

    transform:
        translate(-50%,-50%);

    z-index: 100;

    padding:
        8px 16px;

    border-radius: 30px;

    background:
        rgba(0,0,0,.65);

    backdrop-filter:
        blur(10px);

    font-size: 11px;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .12s ease;
}


.status.show {
    opacity: 1;
}


/* =========================================================
   HIDDEN YOUTUBE PLAYER
========================================================= */

#youtube-player {

    position: fixed;

    left: -1000px;

    top: -1000px;

    width: 320px;

    height: 180px;

    opacity: 0;

    pointer-events: none;
}


/* =========================================================
   SIGNATURE
========================================================= */

.signature {

    position: fixed;

    z-index: 100;

    left: 50%;

    bottom: 9px;

    transform:
        translateX(-50%);

    font-size: 11px;

    color:
        rgba(255,255,255,.78);

    white-space: nowrap;

    text-shadow:
        0 2px 10px
        rgba(0,0,0,.9);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px) {


    .topbar {

        top: 14px;

        left: 15px;

        right: 15px;
    }


    .online {
        display: none;
    }


    .top-right {
        gap: 10px;
    }


    .top-link {
        font-size: 11px;
    }


    .logo {

        width:
            45vw;
    }


    .side-button {

        width: 40px;

        height: 40px;

        font-size: 25px;
    }


    #previousSide {
        left: 8px;
    }


    #nextSide {
        right: 8px;
    }


    .player {

        width:
            calc(100vw - 30px);

        height: 86px;

        bottom: 34px;

        padding:
            9px 11px;

        grid-template-columns:
            52px
            minmax(0,1fr)
            105px;

        column-gap: 8px;
    }


    .cover {

        width: 52px;

        height: 52px;
    }


    .song-title {
        font-size: 13px;
    }


    .song-artist {
        font-size: 10px;
    }


    .controls {
        gap: 5px;
    }


    .control-button {

        width: 19px;

        font-size: 12px;
    }


    .play-button {

        width: 40px;

        height: 40px;

        font-size: 15px;
    }


    .menu-button {
        display: none;
    }


    .playlist-panel,
    .spotify-panel {

        left: 15px;

        right: 15px;

        width: auto;

        bottom: 130px;
    }


    .signature {
        font-size: 9px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="background"></div>

<div class="overlay"></div>


<!-- =====================================================
     TOP BAR
===================================================== -->

<div class="topbar">


    <div id="clock">
        11:13 am
    </div>


    <div class="online">

        <span class="online-dot"></span>

        <span>

        </span>

    </div>


    <div class="top-right">


        <div
            class="top-link"
            id="spotifyButton">

            <span class="icon-circle">
                S
            </span>

            Spotify

        </div>


        <div
            class="top-link"
            id="ytMusicButton">

            <span class="icon-circle">

            </span>

            YT Music

        </div>


    </div>

</div>


<!-- =====================================================

===================================================== -->

<div class="logo">

    <img
        src="assets/atal-logo.png"

</div>


<!-- =====================================================

===================================================== -->

<button
    class="side-button"
    id="previousSide"
    aria-label="Previous">

    </div>


    <iframe

        src="https://open.spotify.com/embed/playlist/5W4HW18UxqA2d8AVLsbbOm?utm_source=generator&theme=0"

        width="100%"

        height="340"

        frameborder="0"

        allowfullscreen=""

        allow="
            autoplay;

        "

        loading="lazy">

<!-- =====================================================

<div class="player">


    <!-- COVER -->

    <div class="cover">

        <img
            id="coverImage"
            src="assets/gym-sidhu.png"
            alt="Sidhu Moosewala">

    </div>


    <!-- SONG INFO -->

    <div class="song-info">


        <div
            class="song-title"
            id="songTitle">

            Sidhu Moosewala

        </div>


        <div
            class="song-artist"
            id="songArtist">

        </div>


    </div>

        <span

        </span>


        <input

            class="progress"

            ▶|

        </button>

    </button>


</div>

    class="status"
    id="status">
</div>

     SIGNATURE
===================================================== -->

<div class="signature">

    Made with 💖 from Gaurav

</div>


<!-- =====================================================
     HIDDEN YOUTUBE PLAYER
===================================================== -->

<div id="youtube-player"></div>


<script>

/* =========================================================
   PLAYLIST IDS
========================================================= */

const YOUTUBE_PLAYLIST_ID =
    "PL61b1x9YzrKU-5RwcdWd3ygy2-4Aiznjg";

const SPOTIFY_PLAYLIST_ID =
    "5W4HW18UxqA2d8AVLsbbOm";


/* =========================================================
   VARIABLES
========================================================= */

let player = null;

let playerReady = false;

let isPlaying = false;

let statusTimer = null;


/* =========================================================
   ELEMENTS
========================================================= */

const playButton =
    document.getElementById(
        "playButton"
    );

const previousButton =
    document.getElementById(
        "previousButton"
    );

const nextButton =
    document.getElementById(
        "nextButton"
    );

const previousSide =
    document.getElementById(
        "previousSide"
    );

const nextSide =
    document.getElementById(
        "nextSide"
    );

const songTitle =
    document.getElementById(
        "songTitle"
    );

const songArtist =
    document.getElementById(
        "songArtist"
    );

const coverImage =
    document.getElementById(
        "coverImage"
    );

const progress =
    document.getElementById(
        "progress"
    );

const currentTime =
    document.getElementById(
        "currentTime"
    );

const duration =
    document.getElementById(
        "duration"
    );

const status =
    document.getElementById(
        "status"
    );

const playlistPanel =
    document.getElementById(
        "playlistPanel"
    );

const spotifyPanel =
    document.getElementById(
        "spotifyPanel"
    );


/* =========================================================
   CLOCK
========================================================= */

function updateClock() {

    const now =
        new Date();

    let hours =
        now.getHours();

    const minutes =
        String(
            now.getMinutes()
        ).padStart(
            2,
            "0"
        );

    const period =
        hours >= 12
            ? "pm"
            : "am";

    hours =
        hours % 12 || 12;

    document.getElementById(
        "clock"
    ).textContent =
        `${hours}:${minutes} ${period}`;

}

updateClock();

setInterval(
    updateClock,
    1000
);


/* =========================================================
   STATUS
========================================================= */

function showStatus(message) {

    status.textContent =
        message;

    status.classList.add(
        "show"
    );

    clearTimeout(
        statusTimer
    );

    statusTimer =
        setTimeout(
            function() {

                status.classList.remove(
                    "show"
                );

            },
            1600
        );

}


/* =========================================================
   YOUTUBE IFRAME API
========================================================= */

window.onYouTubeIframeAPIReady =
function() {


    player =
        new YT.Player(
            "youtube-player",
            {

                width: "320",

                height: "180",

                playerVars: {

                    autoplay: 0,

                    controls: 0,

                    playsinline: 1,

                    rel: 0,

                    modestbranding: 1,

                    listType:
                        "playlist",

                    list:
                        YOUTUBE_PLAYLIST_ID,

                    loop: 1,

                    enablejsapi: 1,

                    origin:
                        window.location.origin

                },


                events: {

                    onReady:
                        onPlayerReady,

                    onStateChange:
                        onPlayerStateChange,

                    onError:
                        onPlayerError

                }

            }
        );

};


/* =========================================================
   YOUTUBE READY
========================================================= */

function onPlayerReady() {

    playerReady = true;


    try {

        player.cuePlaylist({

            listType:
                "playlist",

            list:
                YOUTUBE_PLAYLIST_ID,

            index: 0

        });

    }

    catch(error) {

        console.error(error);

    }


    showStatus(
        "Playlist ready"
    );

}


/* =========================================================
   STATE CHANGE
========================================================= */

function onPlayerStateChange(event) {


    if (
        event.data ===
        YT.PlayerState.PLAYING
    ) {

        isPlaying = true;

        playButton.textContent =
            "Ⅱ";

        updateSongInfo();

    }


    else if (
        event.data ===
        YT.PlayerState.PAUSED
    ) {

        isPlaying = false;

        playButton.textContent =
            "▶";

    }


    else if (
        event.data ===
        YT.PlayerState.ENDED
    ) {

        isPlaying = false;

        playButton.textContent =
            "▶";

    }


    else if (
        event.data ===
        YT.PlayerState.CUED
    ) {

        updateSongInfo();

    }

}


/* =========================================================
   YOUTUBE ERROR
========================================================= */

function onPlayerError(event) {

    console.error(
        "YouTube error:",
        event.data
    );


    let message =
        "YouTube playback error";


    if (event.data === 2) {

        message =
            "Invalid YouTube request";

    }


    else if (event.data === 5) {

        message =
            "HTML5 player error";

    }


    else if (event.data === 100) {

        message =
            "Video unavailable";

    }


    else if (
        event.data === 101 ||
        event.data === 150
    ) {

        message =
            "This video cannot be embedded";

    }


    else if (event.data === 153) {

        message =
            "YouTube rejected this player";

    }


    showStatus(
        message
    );

}


/* =========================================================
   PLAY / PAUSE
========================================================= */

playButton.addEventListener(
    "click",
    function() {


        if (
            !playerReady ||
            !player
        ) {

            showStatus(
                "YouTube is loading..."
            );

            return;

        }


        if (isPlaying) {


            isPlaying = false;

            playButton.textContent =
                "▶";

            player.pauseVideo();


        }

        else {


            isPlaying = true;

            playButton.textContent =
                "Ⅱ";

            player.playVideo();

        }

    }
);


/* =========================================================
   PREVIOUS
========================================================= */

function previousSong() {


    if (
        !playerReady ||
        !player
    ) {

        showStatus(
            "YouTube is loading..."
        );

        return;

    }


    previousButton.style.transform =
        "scale(.75)";


    setTimeout(

        },

    );

        player.previousVideo();

    }

}

/* =========================================================
   SONG INFORMATION
========================================================= */

function updateSongInfo() {


    if (
        !playerReady ||
        !player
    )
        return;


    try {


        const data =
            player.getVideoData();


        if (
            data &&
            data.title
        ) {

            songTitle.textContent =
                data.title;

        }


        if (
            data &&
            data.author
        ) {

            songArtist.textContent =
                data.author;

        }


        if (
            data &&
            data.video_id
        ) {

            coverImage.src =
                "https://i.ytimg.com/vi/" +
                data.video_id +
                "/hqdefault.jpg";

        }


    }

    catch(error) {

        console.log(
            "Waiting for metadata..."
        );

    }

}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress() {


    if (
        !playerReady ||
        !player
    )
        return;


    try {


        const total =
            player.getDuration();


        const current =
            player.getCurrentTime();


        if (
            total &&
            total > 0
        ) {


            progress.value =
                (
                    current /
                    total
                ) * 100;


            currentTime.textContent =
                formatTime(
                    current
                );


            duration.textContent =
                formatTime(
                    total
                );

        }

    }

    catch(error) {

        // Player isn't ready.

    }

}


setInterval(
    updateProgress,
    400
);


/* =========================================================
   SEEK
========================================================= */

progress.addEventListener(
    "input",
    function() {


        if (
            !playerReady ||
            !player
        )
            return;


        try {


            const total =
                player.getDuration();


            if (!total)
                return;


            const target =
                (
                    Number(
                        progress.value
                    ) / 100
                ) * total;


            player.seekTo(
                target,
                true
            );


        }

        catch(error) {

            console.error(
                error
            );

        }

    }
);


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(seconds) {

    seconds =
        Math.floor(
            Number(seconds) || 0
        );


    const minutes =
        Math.floor(
            seconds / 60
        );


    const remaining =
        String(
            seconds % 60
        ).padStart(
            2,
            "0"
        );


    return (
        minutes +
        ":" +
        remaining
    );

}

/* =========================================================
   KEYBOARD CONTROLS
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.target.tagName ===
            "INPUT"
        ) {

            return;

        }


        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();

            playButton.click();

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            previousSong();

        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            nextSong();

        }

    }
);


/* =========================================================
   CLOSE PANELS WITH ESC
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key ===
            "Escape"
        ) {

            playlistPanel.classList.remove(
                "open"
            );

            spotifyPanel.classList.remove(
                "open"
            );

        }

    }
);

   LOAD YOUTUBE API
========================================================= */

const youtubeScript =
    document.createElement(
        "script"
    );


youtubeScript.src =
    "https://www.youtube.com/iframe_api";


youtubeScript.async = true;


document.head.appendChild(
    youtubeScript
);

</script>
