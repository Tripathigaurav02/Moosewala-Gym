<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">

<title>अटल जिम</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================================================
   BACKGROUND
========================================================= */

.background {
    position: fixed;
    inset: -5%;

    width: 110%;
    height: 110%;

    background-image:
        linear-gradient(
            rgba(0,0,0,0.08),
            rgba(0,0,0,0.25)
        ),
        url("assets/gym-sidhu.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    z-index: 0;

    animation: breathingBackground 20s ease-in-out infinite alternate;
}

@keyframes breathingBackground {
    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.045);
    }

    100% {
        transform: scale(1.09);
    }
}

/* =========================================================
   OVERLAY
========================================================= */

.overlay {
    position: fixed;
    inset: 0;
    z-index: 1;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,0.04),
            transparent 45%,
            rgba(0,0,0,0.30)
        );

    pointer-events: none;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar {
    position: fixed;
    top: 28px;
    left: 30px;
    right: 30px;

    z-index: 20;

    display: flex;
    justify-content: space-between;
    align-items: center;

    font-size: 16px;
    font-weight: 700;

    text-shadow:
        0 2px 10px rgba(0,0,0,0.85);
}

.online {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);

    display: flex;
    align-items: center;
    gap: 9px;
}

.online-dot {
    width: 11px;
    height: 11px;

    border-radius: 50%;

    background: #59f38d;

    box-shadow:
        0 0 13px rgba(89,243,141,0.9);
}

.top-right {
    display: flex;
    align-items: center;
    gap: 25px;
}

.top-link {
    display: flex;
    align-items: center;
    gap: 8px;

    cursor: pointer;

    opacity: 0.9;

    transition: 0.2s;
}

.top-link:hover {
    opacity: 1;
}

.icon-circle {
    width: 26px;
    height: 26px;

    border:
        1px solid
        rgba(255,255,255,0.75);

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 11px;
}

/* =========================================================
   CENTER LOGO
========================================================= */

.logo {
    position: fixed;

    z-index: 10;

    left: 50%;
    top: 48%;

    transform:
        translate(-50%, -50%);

    width:
        min(650px, 57vw);

    pointer-events: none;

    filter:
        drop-shadow(
            0 12px 25px
            rgba(0,0,0,0.35)
        );
}

.logo img {
    display: block;
    width: 100%;
    height: auto;
}

/* =========================================================
   COMPACT SIDE NAVIGATION
========================================================= */

.side-button {
    position: fixed;

    top: 50%;
    transform: translateY(-50%);

    z-index: 30;

    width: 48px;
    height: 48px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,0.20);

    background:
        rgba(30,20,17,0.28);

    backdrop-filter: blur(8px);

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 28px;
    font-weight: 300;

    cursor: pointer;

    transition: 0.2s;
}

.side-button:hover {
    background:
        rgba(30,20,17,0.50);

    border-color:
        rgba(255,255,255,0.38);

    transform:
        translateY(-50%) scale(1.06);
}

.side-button:active {
    transform:
        translateY(-50%) scale(0.93);
}

#previousSide {
    left: 28px;
}

#nextSide {
    right: 28px;
}

/* =========================================================
   MAIN PLAYER
========================================================= */

.player {
    position: fixed;

    z-index: 50;

    left: 50%;
    bottom: 58px;

    transform: translateX(-50%);

    width:
        min(760px, calc(100vw - 100px));

    height: 104px;

    padding: 11px 13px;

    border-radius: 58px;

    background:
        linear-gradient(
            135deg,
            rgba(151,48,37,0.97),
            rgba(104,28,22,0.97)
        );

    box-shadow:
        0 25px 65px
        rgba(0,0,0,0.55),

        inset
        0 1px
        rgba(255,255,255,0.18);

    display: grid;

    grid-template-columns:
        70px
        1fr
        160px;

    grid-template-rows:
        1fr 22px;

    column-gap: 14px;

    align-items: center;
}

/* =========================================================
   COVER
========================================================= */

.cover {
    width: 70px;
    height: 70px;

    grid-row: 1 / 3;

    border-radius: 50%;

    overflow: hidden;

    background: #210b08;

    box-shadow:
        0 8px 24px
        rgba(0,0,0,0.45);
}

.cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* =========================================================
   SONG INFORMATION
========================================================= */

.song-info {
    min-width: 0;
    align-self: center;
}

.song-title {
    font-size: 18px;
    font-weight: 700;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.song-artist {
    margin-top: 5px;

    font-size: 13px;

    color:
        rgba(255,255,255,0.70);

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* =========================================================
   COMPACT SALOON-STYLE CONTROL PILL
========================================================= */

.control-pill {
    width: 145px;
    height: 62px;

    border-radius: 34px;

    background:
        rgba(30,28,34,0.94);

    border:
        1px solid
        rgba(255,255,255,0.14);

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 15px;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,0.25);
}

/* Previous / Next */

.control-small {
    width: 24px;
    height: 30px;

    border: none;

    background: transparent;

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    opacity: 0.85;

    font-size: 18px;

    transition:
        transform 0.15s,
        opacity 0.15s;
}

.control-small:hover {
    opacity: 1;
    transform: scale(1.12);
}

.control-small:active {
    transform: scale(0.90);
}

/* =========================================================
   CENTRAL PLAY BUTTON
========================================================= */

.play-button {
    width: 46px;
    height: 46px;

    border: none;

    border-radius: 50%;

    background: white;

    color: #111;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 19px;

    cursor: pointer;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,0.25);

    transition:
        transform 0.18s,
        box-shadow 0.18s;
}

.play-button:hover {
    transform: scale(1.06);

    box-shadow:
        0 7px 20px
        rgba(0,0,0,0.35);
}

.play-button:active {
    transform: scale(0.92);
}

/* =========================================================
   PROGRESS
========================================================= */

.progress-area {
    grid-column: 2 / 4;

    display: grid;

    grid-template-columns:
        35px
        1fr
        35px;

    gap: 8px;

    align-items: center;
}

.time {
    font-size: 10px;

    color:
        rgba(255,255,255,0.70);
}

.progress {
    width: 100%;
    height: 4px;

    appearance: none;

    border-radius: 10px;

    background:
        rgba(255,255,255,0.30);

    cursor: pointer;
}

.progress::-webkit-slider-thumb {
    appearance: none;

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: white;
}

.progress::-moz-range-thumb {
    width: 9px;
    height: 9px;

    border: none;

    border-radius: 50%;

    background: white;
}

/* =========================================================
   PLAYLIST BUTTON
========================================================= */

.menu-button {
    position: absolute;

    right: -54px;
    top: 50%;

    transform: translateY(-50%);

    width: 42px;
    height: 42px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,0.22);

    background:
        rgba(20,15,13,0.28);

    color: white;

    font-size: 17px;

    cursor: pointer;

    transition: 0.2s;
}

.menu-button:hover {
    background:
        rgba(20,15,13,0.55);

    transform:
        translateY(-50%) scale(1.05);
}

/* =========================================================
   PLAYLIST PANEL
========================================================= */

.playlist-panel {
    position: fixed;

    z-index: 45;

    right: 35px;
    bottom: 180px;

    width: 360px;

    max-height: 400px;

    overflow-y: auto;

    padding: 20px;

    border-radius: 20px;

    background:
        rgba(19,14,12,0.94);

    border:
        1px solid
        rgba(255,255,255,0.14);

    backdrop-filter:
        blur(18px);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,0.60);

    opacity: 0;
    visibility: hidden;

    transform: translateY(15px);

    transition:
        opacity 0.25s,
        transform 0.25s,
        visibility 0.25s;
}

.playlist-panel.open {
    opacity: 1;
    visibility: visible;

    transform: translateY(0);
}

.playlist-title {
    font-size: 12px;

    letter-spacing: 0.14em;

    color:
        rgba(255,255,255,0.55);

    margin-bottom: 14px;
}

.playlist-info {
    font-size: 12px;

    line-height: 1.7;

    color:
        rgba(255,255,255,0.62);
}

/* =========================================================
   STATUS
========================================================= */

.status {
    position: fixed;

    left: 50%;
    top: 72%;

    transform:
        translate(-50%, -50%);

    z-index: 100;

    padding:
        8px 17px;

    border-radius: 30px;

    background:
        rgba(0,0,0,0.58);

    backdrop-filter:
        blur(10px);

    font-size: 11px;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 0.25s;
}

.status.show {
    opacity: 1;
}

/* =========================================================
   HIDDEN YOUTUBE PLAYER
========================================================= */

#youtube-player {
    position: fixed;

    left: -1000px;
    top: -1000px;

    width: 320px;
    height: 180px;

    opacity: 0;

    pointer-events: none;
}

/* =========================================================
   FOOTER
========================================================= */

.signature {
    position: fixed;

    z-index: 100;

    left: 50%;
    bottom: 12px;

    transform:
        translateX(-50%);

    font-size: 11px;

    color:
        rgba(255,255,255,0.78);

    white-space: nowrap;

    text-shadow:
        0 2px 10px
        rgba(0,0,0,0.9);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 800px) {

    .topbar {
        top: 15px;
        left: 15px;
        right: 15px;
    }

    .online {
        display: none;
    }

    .top-right {
        gap: 10px;
    }

    .top-link {
        font-size: 11px;
    }

    .logo {
        width: 78vw;
    }

    .side-button {
        width: 42px;
        height: 42px;

        font-size: 25px;
    }

    #previousSide {
        left: 10px;
    }

    #nextSide {
        right: 10px;
    }

    .player {
        width:
            calc(100vw - 30px);

        height: 90px;

        bottom: 36px;

        grid-template-columns:
            58px
            1fr
            125px;

        column-gap: 10px;

        border-radius: 50px;
    }

    .cover {
        width: 58px;
        height: 58px;
    }

    .song-title {
        font-size: 14px;
    }

    .song-artist {
        font-size: 10px;
    }

    .control-pill {
        width: 115px;
        height: 50px;

        gap: 9px;
    }

    .play-button {
        width: 38px;
        height: 38px;

        font-size: 16px;
    }

    .control-small {
        font-size: 15px;
    }

    .menu-button {
        display: none;
    }

    .playlist-panel {
        left: 15px;
        right: 15px;

        width: auto;

        bottom: 140px;
    }

    .signature {
        font-size: 9px;
    }
}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion: reduce) {

    .background {
        animation: none;
    }
}

</style>
</head>

<body>

<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="background"></div>
<div class="overlay"></div>


<!-- =====================================================
     TOP BAR
===================================================== -->

<div class="topbar">

    <div id="clock">
        11:13 am
    </div>

    <div class="online">

        <span class="online-dot"></span>

        <span>
            listening now
        </span>

    </div>

    <div class="top-right">

        <div
            class="top-link"
            id="spotifyButton">

            <span class="icon-circle">
                S
            </span>

            Spotify

        </div>

        <div
            class="top-link"
            id="ytMusicButton">

            <span class="icon-circle">
                ▶
            </span>

            YT Music

        </div>

    </div>

</div>


<!-- =====================================================
     LOGO
===================================================== -->

<div class="logo">

    <img
        src="assets/atal-logo.png"
        alt="अटल जिम">

</div>


<!-- =====================================================
     SIDE BUTTONS
===================================================== -->

<button
    class="side-button"
    id="previousSide"
    aria-label="Previous">

    ‹

</button>


<button
    class="side-button"
    id="nextSide"
    aria-label="Next">

    ›

</button>


<!-- =====================================================
     PLAYLIST PANEL
===================================================== -->

<div
    class="playlist-panel"
    id="playlistPanel">

    <div class="playlist-title">
        SIDHU MOOSEWALA PLAYLIST
    </div>

    <div class="playlist-info">

        The player is connected directly
        to your YouTube playlist.

        <br><br>

        Use the compact controls to play,
        pause, or move between songs.

    </div>

</div>


<!-- =====================================================
     MUSIC PLAYER
===================================================== -->

<div class="player">


    <!-- COVER -->

    <div class="cover">

        <img
            id="coverImage"
            src="assets/gym-sidhu.png"
            alt="Sidhu Moosewala">

    </div>


    <!-- SONG INFO -->

    <div class="song-info">

        <div
            class="song-title"
            id="songTitle">

            Sidhu Moosewala

        </div>

        <div
            class="song-artist"
            id="songArtist">

            Playlist

        </div>

    </div>


    <!-- =================================================
         COMPACT CONTROL PILL
    ================================================== -->

    <div class="control-pill">


        <!-- PREVIOUS -->

        <button
            class="control-small"
            id="previousButton"
            aria-label="Previous song">

            |◀

        </button>


        <!-- PLAY / PAUSE -->

        <button
            class="play-button"
            id="playButton"
            aria-label="Play">

            ▶

        </button>


        <!-- NEXT -->

        <button
            class="control-small"
            id="nextButton"
            aria-label="Next song">

            ▶|

        </button>

    </div>


    <!-- =================================================
         PROGRESS
    ================================================== -->

    <div class="progress-area">

        <span
            class="time"
            id="currentTime">

            0:00

        </span>

        <input
            class="progress"
            id="progress"
            type="range"
            min="0"
            max="100"
            value="0">

        <span
            class="time"
            id="duration">

            0:00

        </span>

    </div>


    <!-- MENU -->

    <button
        class="menu-button"
        id="menuButton"
        aria-label="Playlist">

        ☰

    </button>

</div>


<!-- =====================================================
     STATUS
===================================================== -->

<div
    class="status"
    id="status">
</div>


<!-- =====================================================
     FOOTER
===================================================== -->

<div class="signature">

    Made with 💖 from Gaurav

</div>


<!-- =====================================================
     HIDDEN YOUTUBE PLAYER
===================================================== -->

<div id="youtube-player"></div>


<script>

/* =====================================================
   YOUR PLAYLIST
===================================================== */

const PLAYLIST_ID =
    "PL61b1x9YzrKU-5RwcdWd3ygy2-4Aiznjg";


/* =====================================================
   PLAYER VARIABLES
===================================================== */

let player = null;

let playerReady = false;

let isPlaying = false;

let statusTimer = null;


/* =====================================================
   ELEMENTS
===================================================== */

const playButton =
    document.getElementById(
        "playButton"
    );

const previousButton =
    document.getElementById(
        "previousButton"
    );

const nextButton =
    document.getElementById(
        "nextButton"
    );

const previousSide =
    document.getElementById(
        "previousSide"
    );

const nextSide =
    document.getElementById(
        "nextSide"
    );

const songTitle =
    document.getElementById(
        "songTitle"
    );

const songArtist =
    document.getElementById(
        "songArtist"
    );

const coverImage =
    document.getElementById(
        "coverImage"
    );

const progress =
    document.getElementById(
        "progress"
    );

const currentTime =
    document.getElementById(
        "currentTime"
    );

const duration =
    document.getElementById(
        "duration"
    );

const status =
    document.getElementById(
        "status"
    );

const playlistPanel =
    document.getElementById(
        "playlistPanel"
    );


/* =====================================================
   CLOCK
===================================================== */

function updateClock() {

    const now = new Date();

    let hours =
        now.getHours();

    const minutes =
        String(
            now.getMinutes()
        ).padStart(2, "0");

    const period =
        hours >= 12
            ? "pm"
            : "am";

    hours =
        hours % 12 || 12;

    document.getElementById(
        "clock"
    ).textContent =
        `${hours}:${minutes} ${period}`;

}

updateClock();

setInterval(
    updateClock,
    1000
);


/* =====================================================
   STATUS
===================================================== */

function showStatus(message) {

    status.textContent =
        message;

    status.classList.add(
        "show"
    );

    clearTimeout(
        statusTimer
    );

    statusTimer =
        setTimeout(
            function () {

                status.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =====================================================
   YOUTUBE API
===================================================== */

window.onYouTubeIframeAPIReady =
function () {

    player =
        new YT.Player(
            "youtube-player",
            {

                width: "320",
                height: "180",

                playerVars: {

                    autoplay: 0,

                    controls: 0,

                    playsinline: 1,

                    rel: 0,

                    listType:
                        "playlist",

                    list:
                        PLAYLIST_ID,

                    loop: 1,

                    enablejsapi: 1,

                    origin:
                        window.location.origin

                },

                events: {

                    onReady:
                        onPlayerReady,

                    onStateChange:
                        onPlayerStateChange,

                    onError:
                        onPlayerError

                }

            }
        );

};


/* =====================================================
   PLAYER READY
===================================================== */

function onPlayerReady() {

    playerReady = true;

    try {

        player.cuePlaylist({

            listType:
                "playlist",

            list:
                PLAYLIST_ID,

            index: 0

        });

    }

    catch(error) {

        console.error(error);

    }

    songTitle.textContent =
        "Sidhu Moosewala";

    songArtist.textContent =
        "Playlist ready";

    showStatus(
        "Playlist ready"
    );

}


/* =====================================================
   STATE CHANGE
===================================================== */

function onPlayerStateChange(event) {

    if (
        event.data ===
        YT.PlayerState.PLAYING
    ) {

        isPlaying = true;

        playButton.textContent =
            "Ⅱ";

        updateSongInfo();

    }

    else if (
        event.data ===
        YT.PlayerState.PAUSED
    ) {

        isPlaying = false;

        playButton.textContent =
            "▶";

    }

    else if (
        event.data ===
        YT.PlayerState.ENDED
    ) {

        isPlaying = false;

        playButton.textContent =
            "▶";

    }

    else if (
        event.data ===
        YT.PlayerState.CUED
    ) {

        updateSongInfo();

    }

}


/* =====================================================
   ERROR
===================================================== */

function onPlayerError(event) {

    console.error(
        "YouTube error:",
        event.data
    );

    let message =
        "YouTube playback error";

    if (event.data === 2) {
        message =
            "Invalid YouTube request";
    }

    if (event.data === 5) {
        message =
            "HTML5 player error";
    }

    if (event.data === 100) {
        message =
            "Video unavailable";
    }

    if (
        event.data === 101 ||
        event.data === 150
    ) {
        message =
            "Video cannot be embedded";
    }

    if (event.data === 153) {
        message =
            "YouTube rejected the player request";
    }

    showStatus(message);

}


/* =====================================================
   PLAY / PAUSE
===================================================== */

playButton.addEventListener(
    "click",
    function () {

        if (!playerReady) {

            showStatus(
                "YouTube is loading..."
            );

            return;

        }

        if (isPlaying) {

            player.pauseVideo();

        }

        else {

            player.playVideo();

        }

    }
);


/* =====================================================
   PREVIOUS
===================================================== */

function previousSong() {

    if (!playerReady) {

        showStatus(
            "Playlist is loading..."
        );

        return;

    }

    try {

        player.previousVideo();

    }

    catch(error) {

        console.error(error);

    }

}


/* =====================================================
   NEXT
===================================================== */

function nextSong() {

    if (!playerReady) {

        showStatus(
            "Playlist is loading..."
        );

        return;

    }

    try {

        player.nextVideo();

    }

    catch(error) {

        console.error(error);

    }

}


/* COMPACT BUTTONS */

previousButton.addEventListener(
    "click",
    previousSong
);

nextButton.addEventListener(
    "click",
    nextSong
);


/* SIDE BUTTONS */

previousSide.addEventListener(
    "click",
    previousSong
);

nextSide.addEventListener(
    "click",
    nextSong
);


/* =====================================================
   SONG INFO
===================================================== */

function updateSongInfo() {

    if (!playerReady)
        return;

    try {

        const data =
            player.getVideoData();

        if (
            data &&
            data.title
        ) {

            songTitle.textContent =
                data.title;

        }

        if (
            data &&
            data.author
        ) {

            songArtist.textContent =
                data.author;

        }

        if (
            data &&
            data.video_id
        ) {

            coverImage.src =
                "https://i.ytimg.com/vi/" +
                data.video_id +
                "/hqdefault.jpg";

        }

    }

    catch(error) {

        console.log(
            "Waiting for song metadata..."
        );

    }

}


/* =====================================================
   PROGRESS
===================================================== */

function updateProgress() {

    if (!playerReady)
        return;

    try {

        const total =
            player.getDuration();

        const current =
            player.getCurrentTime();

        if (
            total &&
            total > 0
        ) {

            progress.value =
                (
                    current /
                    total
                ) * 100;

            currentTime.textContent =
                formatTime(current);

            duration.textContent =
                formatTime(total);

        }

    }

    catch(error) {

        // Metadata not ready yet.

    }

}

setInterval(
    updateProgress,
    500
);


/* =====================================================
   SEEK
===================================================== */

progress.addEventListener(
    "input",
    function () {

        if (!playerReady)
            return;

        const total =
            player.getDuration();

        if (!total)
            return;

        const target =
            (
                Number(
                    progress.value
                ) / 100
            ) * total;

        player.seekTo(
            target,
            true
        );

    }
);


/* =====================================================
   TIME FORMAT
===================================================== */

function formatTime(seconds) {

    seconds =
        Math.floor(
            Number(seconds) || 0
        );

    const minutes =
        Math.floor(
            seconds / 60
        );

    const remaining =
        String(
            seconds % 60
        ).padStart(
            2,
            "0"
        );

    return (
        minutes +
        ":" +
        remaining
    );

}

        if (
            event.key ===

            event.key ===
            "ArrowRight"

            nextSong();

        }

    }
);
