<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>अटल जिम</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #050505;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =====================================================
   BACKGROUND
===================================================== */

.background {
    position: fixed;

    inset: -4%;

    width: 108%;
    height: 108%;

    background-image:
        linear-gradient(
            rgba(0,0,0,0.08),
            rgba(0,0,0,0.22)
        ),
        url("assets/gym-sidhu.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    z-index: 0;

    animation:
        slowZoom
        18s
        ease-in-out
        infinite
        alternate;
}


/* =====================================================
   SLOW BACKGROUND ZOOM
===================================================== */

@keyframes slowZoom {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.045);
    }

    100% {
        transform: scale(1.09);
    }

}


/* =====================================================
   DARK OVERLAY
===================================================== */

.overlay {

    position: fixed;

    inset: 0;

    z-index: 1;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,0.05),
            transparent 45%,
            rgba(0,0,0,0.28)
        );

    pointer-events: none;
}


/* =====================================================
   TOP BAR
===================================================== */

.topbar {

    position: fixed;

    top: 28px;
    left: 30px;
    right: 30px;

    z-index: 20;

    display: flex;

    justify-content: space-between;

    align-items: center;

    font-size: 16px;

    font-weight: 700;

    text-shadow:
        0 2px 10px rgba(0,0,0,0.8);
}


/* =====================================================
   ONLINE
===================================================== */

.online {

    position: absolute;

    left: 50%;

    transform:
        translateX(-50%);

    display: flex;

    align-items: center;

    gap: 9px;
}

.online-dot {

    width: 11px;
    height: 11px;

    border-radius: 50%;

    background: #5cff91;

    box-shadow:
        0 0 12px
        rgba(92,255,145,0.9);
}


/* =====================================================
   TOP RIGHT
===================================================== */

.top-right {

    display: flex;

    align-items: center;

    gap: 25px;
}

.top-link {

    display: flex;

    align-items: center;

    gap: 8px;

    cursor: pointer;

    opacity: 0.92;

    transition: 0.2s;
}

.top-link:hover {

    opacity: 1;

    transform: translateY(-1px);
}

.icon-circle {

    width: 26px;
    height: 26px;

    border:
        1px solid
        rgba(255,255,255,0.75);

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 11px;
}


/* =====================================================
   CENTER LOGO
===================================================== */

.logo {

    position: fixed;

    z-index: 10;

    left: 50%;
    top: 48%;

    transform:
        translate(-50%, -50%);

    width:
        min(650px, 57vw);

    pointer-events: none;

    filter:
        drop-shadow(
            0 10px 25px
            rgba(0,0,0,0.35)
        );
}

.logo img {

    width: 100%;

    height: auto;

    display: block;
}


/* =====================================================
   PREVIOUS / NEXT BUTTONS
===================================================== */

.nav-button {

    position: fixed;

    top: 50%;

    transform:
        translateY(-50%);

    z-index: 30;

    width: 48px;
    height: 48px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,0.22);

    background:
        rgba(30,20,17,0.30);

    backdrop-filter:
        blur(8px);

    color: white;

    font-size: 28px;

    font-weight: 300;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    transition:
        background 0.2s,
        transform 0.2s,
        border 0.2s;
}

.nav-button:hover {

    background:
        rgba(30,20,17,0.55);

    border-color:
        rgba(255,255,255,0.40);

    transform:
        translateY(-50%)
        scale(1.06);
}

.nav-button:active {

    transform:
        translateY(-50%)
        scale(0.94);
}


#previous {

    left: 28px;
}


#next {

    right: 28px;
}


/* =====================================================
   MUSIC PLAYER
===================================================== */

.player {

    position: fixed;

    left: 50%;

    bottom: 62px;

    transform:
        translateX(-50%);

    z-index: 50;

    width:
        min(760px, calc(100vw - 110px));

    height: 105px;

    padding:
        11px 14px;

    border-radius: 58px;

    background:
        linear-gradient(
            135deg,
            rgba(153,49,38,0.96),
            rgba(108,29,23,0.96)
        );

    box-shadow:
        0 20px 60px
        rgba(0,0,0,0.50),

        inset
        0 1px
        rgba(255,255,255,0.18);

    display: grid;

    grid-template-columns:
        70px
        1fr
        48px;

    grid-template-rows:
        1fr
        20px;

    column-gap: 14px;

    align-items: center;
}


/* =====================================================
   COVER
===================================================== */

.cover {

    width: 70px;
    height: 70px;

    border-radius: 50%;

    overflow: hidden;

    background: #210b08;

    grid-row:
        1 / 3;

    box-shadow:
        0 7px 22px
        rgba(0,0,0,0.40);
}

.cover img {

    width: 100%;
    height: 100%;

    object-fit: cover;
}


/* =====================================================
   SONG INFO
===================================================== */

.song-info {

    min-width: 0;

    align-self: center;
}

.song-title {

    font-size: 18px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.song-artist {

    margin-top: 4px;

    font-size: 13px;

    color:
        rgba(255,255,255,0.70);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =====================================================
   SMALL PLAY / PAUSE BUTTON
===================================================== */

.play-button {

    width: 44px;
    height: 44px;

    border-radius: 50%;

    border: none;

    background: white;

    color: #111;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 18px;

    cursor: pointer;

    transition:
        transform 0.2s,
        box-shadow 0.2s;
}

.play-button:hover {

    transform: scale(1.06);

    box-shadow:
        0 5px 20px
        rgba(0,0,0,0.25);
}

.play-button:active {

    transform: scale(0.94);
}


/* =====================================================
   PROGRESS
===================================================== */

.progress-area {

    grid-column:
        2 / 4;

    display: grid;

    grid-template-columns:
        35px 1fr 35px;

    align-items: center;

    gap: 8px;
}

.time {

    font-size: 10px;

    color:
        rgba(255,255,255,0.70);
}

.progress {

    width: 100%;

    height: 4px;

    appearance: none;

    border-radius: 20px;

    background:
        rgba(255,255,255,0.30);

    cursor: pointer;
}

.progress::-webkit-slider-thumb {

    appearance: none;

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: white;
}

.progress::-moz-range-thumb {

    width: 9px;
    height: 9px;

    border: none;

    border-radius: 50%;

    background: white;
}


/* =====================================================
   PLAYLIST BUTTON
===================================================== */

.menu-button {

    position: absolute;

    right: -54px;

    top: 50%;

    transform:
        translateY(-50%);

    width: 42px;
    height: 42px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,0.22);

    background:
        rgba(20,15,13,0.25);

    color: white;

    font-size: 18px;

    cursor: pointer;

    transition: 0.2s;
}

.menu-button:hover {

    background:
        rgba(20,15,13,0.50);

    transform:
        translateY(-50%)
        scale(1.05);
}


/* =====================================================
   PLAYLIST PANEL
===================================================== */

.playlist-panel {

    position: fixed;

    right: 35px;

    bottom: 185px;

    width: 360px;

    max-height: 400px;

    overflow-y: auto;

    z-index: 45;

    padding: 20px;

    border-radius: 20px;

    background:
        rgba(19,14,12,0.94);

    border:
        1px solid
        rgba(255,255,255,0.13);

    backdrop-filter:
        blur(18px);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,0.55);

    opacity: 0;

    visibility: hidden;

    transform:
        translateY(12px);

    transition:
        opacity 0.25s,
        transform 0.25s,
        visibility 0.25s;
}

.playlist-panel.open {

    opacity: 1;

    visibility: visible;

    transform:
        translateY(0);
}

.playlist-title {

    font-size: 12px;

    letter-spacing: 0.14em;

    color:
        rgba(255,255,255,0.55);

    margin-bottom: 14px;
}

.playlist-info {

    font-size: 12px;

    line-height: 1.6;

    color:
        rgba(255,255,255,0.62);
}


/* =====================================================
   STATUS
===================================================== */

.status {

    position: fixed;

    left: 50%;

    top: 72%;

    transform:
        translate(-50%, -50%);

    z-index: 100;

    padding:
        8px 17px;

    border-radius: 30px;

    background:
        rgba(0,0,0,0.55);

    backdrop-filter:
        blur(10px);

    font-size: 11px;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 0.25s;
}

.status.show {

    opacity: 1;
}


/* =====================================================
   HIDDEN YOUTUBE PLAYER
===================================================== */

#youtube-player {

    position: fixed;

    left: -1000px;
    top: -1000px;

    width: 320px;
    height: 200px;

    opacity: 0;

    pointer-events: none;
}


/* =====================================================
   FOOTER
===================================================== */

.signature {

    position: fixed;

    left: 50%;

    bottom: 13px;

    transform:
        translateX(-50%);

    z-index: 100;

    font-size: 11px;

    color:
        rgba(255,255,255,0.78);

    white-space: nowrap;

    text-shadow:
        0 2px 10px
        rgba(0,0,0,0.9);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width: 800px) {

    .topbar {

        top: 15px;

        left: 15px;

        right: 15px;
    }

    .online {

        display: none;
    }

    .top-right {

        gap: 10px;
    }

    .top-link {

        font-size: 11px;
    }

    .logo {

        width: 78vw;
    }

    .nav-button {

        width: 42px;
        height: 42px;

        font-size: 25px;
    }

    #previous {

        left: 10px;
    }

    #next {

        right: 10px;
    }

    .player {

        width:
            calc(100vw - 40px);

        height: 92px;

        bottom: 38px;

        grid-template-columns:
            58px
            1fr
            44px;

        border-radius: 50px;
    }

    .cover {

        width: 58px;
        height: 58px;
    }

    .song-title {

        font-size: 14px;
    }

    .song-artist {

        font-size: 10px;
    }

    .play-button {

        width: 40px;
        height: 40px;

        font-size: 16px;
    }

    .menu-button {

        display: none;
    }

    .playlist-panel {

        left: 15px;
        right: 15px;

        width: auto;

        bottom: 145px;
    }

    .signature {

        font-size: 9px;
    }

}


/* =====================================================
   REDUCE ANIMATION FOR USERS WHO REQUEST IT
===================================================== */

@media(prefers-reduced-motion: reduce) {

    .background {

        animation: none;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="background"></div>

<div class="overlay"></div>


<!-- =====================================================
     TOP BAR
===================================================== -->

<div class="topbar">

    <div id="clock">
        11:13 am
    </div>


    <div class="online">

        <span class="online-dot"></span>

        <span>
            listening now
        </span>

    </div>


    <div class="top-right">

        <div
            class="top-link"
            id="spotifyButton">

            <span class="icon-circle">
                S
            </span>

            Spotify

        </div>


        <div
            class="top-link"
            id="ytMusicButton">

            <span class="icon-circle">
                ▶
            </span>

            YT Music

        </div>

    </div>

</div>


<!-- =====================================================
     CENTER LOGO
===================================================== -->

<div class="logo">

    <img
        src="assets/atal-logo.png"
        alt="अटल जिम">

</div>


<!-- =====================================================
     PREVIOUS BUTTON
===================================================== -->

<button
    class="nav-button"
    id="previous"
    aria-label="Previous song">

    ‹

</button>


<!-- =====================================================
     NEXT BUTTON
===================================================== -->

<button
    class="nav-button"
    id="next"
    aria-label="Next song">

    ›

</button>


<!-- =====================================================
     PLAYLIST PANEL
===================================================== -->

<div
    class="playlist-panel"
    id="playlistPanel">

    <div class="playlist-title">

        SIDHU MOOSEWALA PLAYLIST

    </div>

    <div class="playlist-info">

        Your music is being played directly
        from the YouTube playlist.

        <br><br>

        Use the previous and next buttons
        to move through the playlist.

    </div>

</div>


<!-- =====================================================
     MUSIC PLAYER
===================================================== -->

<div class="player">


    <!-- COVER -->

    <div class="cover">

        <img
            id="coverImage"
            src="assets/gym-sidhu.png"
            alt="Sidhu Moosewala">

    </div>


    <!-- SONG INFORMATION -->

    <div class="song-info">

        <div
            class="song-title"
            id="songTitle">

            Sidhu Moosewala

        </div>

        <div
            class="song-artist"
            id="songArtist">

            Playlist

        </div>

    </div>


    <!-- SMALL PLAY / PAUSE -->

    <button
        class="play-button"
        id="playButton"
        aria-label="Play">

        ▶

    </button>


    <!-- PROGRESS -->

    <div class="progress-area">

        <span
            class="time"
            id="currentTime">

            0:00

        </span>


        <input
            class="progress"
            id="progress"
            type="range"
            min="0"
            max="100"
            value="0"
            aria-label="Song progress">


        <span
            class="time"
            id="duration">

            0:00

        </span>

    </div>


    <!-- PLAYLIST MENU -->

    <button
        class="menu-button"
        id="menuButton"
        aria-label="Playlist">

        ☰

    </button>

</div>


<!-- =====================================================
     STATUS
===================================================== -->

<div
    class="status"
    id="status">

</div>


<!-- =====================================================
     FOOTER
===================================================== -->

<div class="signature">

    Made with 💖 from Gaurav

</div>


<!-- =====================================================
     YOUTUBE PLAYER
===================================================== -->

<div id="youtube-player"></div>


<script>

/* =====================================================
   PLAYLIST
===================================================== */

const PLAYLIST_ID =
    "PL61b1x9YzrKU-5RwcdWd3ygy2-4Aiznjg";


/* =====================================================
   VARIABLES
===================================================== */

let player = null;

let playerReady = false;

let isPlaying = false;

let statusTimeout = null;


/* =====================================================
   ELEMENTS
===================================================== */

const playButton =
    document.getElementById(
        "playButton"
    );

const previousButton =
    document.getElementById(
        "previous"
    );

const nextButton =
    document.getElementById(
        "next"
    );

const songTitle =
    document.getElementById(
        "songTitle"
    );

const songArtist =
    document.getElementById(
        "songArtist"
    );

const coverImage =
    document.getElementById(
        "coverImage"
    );

const progress =
    document.getElementById(
        "progress"
    );

const currentTime =
    document.getElementById(
        "currentTime"
    );

const duration =
    document.getElementById(
        "duration"
    );

const status =
    document.getElementById(
        "status"
    );

const playlistPanel =
    document.getElementById(
        "playlistPanel"
    );


/* =====================================================
   CLOCK
===================================================== */

function updateClock() {

    const now =
        new Date();

    let hours =
        now.getHours();

    const minutes =
        String(
            now.getMinutes()
        ).padStart(
            2,
            "0"
        );

    const period =
        hours >= 12
            ? "pm"
            : "am";

    hours =
        hours % 12 || 12;

    document.getElementById(
        "clock"
    ).textContent =
        `${hours}:${minutes} ${period}`;

}

updateClock();

setInterval(
    updateClock,
    1000
);


/* =====================================================
   STATUS
===================================================== */

function showStatus(message) {

    status.textContent =
        message;

    status.classList.add(
        "show"
    );

    clearTimeout(
        statusTimeout
    );

    statusTimeout =
        setTimeout(
            function () {

                status.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =====================================================
   YOUTUBE API CALLBACK
===================================================== */

window.onYouTubeIframeAPIReady =
function () {

    player =
        new YT.Player(
            "youtube-player",
            {

                width: "320",

                height: "200",

                playerVars: {

                    autoplay: 0,

                    controls: 0,

                    playsinline: 1,

                    rel: 0,

                    listType:
                        "playlist",

                    list:
                        PLAYLIST_ID,

                    loop: 1,

                    enablejsapi: 1,

                    origin:
                        window.location.origin

                },

                events: {

                    onReady:
                        onPlayerReady,

                    onStateChange:
                        onPlayerStateChange,

                    onError:
                        onPlayerError

                }

            }
        );

};


/* =====================================================
   PLAYER READY
===================================================== */

function onPlayerReady() {

    playerReady = true;

    /*
       Explicitly load the playlist.

       This makes the playlist source unambiguous.
    */

    try {

        player.cuePlaylist({

            listType:
                "playlist",

            list:
                PLAYLIST_ID,

            index: 0

        });

    }

    catch (error) {

        console.error(error);

    }

    songTitle.textContent =
        "Sidhu Moosewala";

    songArtist.textContent =
        "Playlist ready";

    showStatus(
        "Playlist ready"
    );

}


/* =====================================================
   PLAYER STATE
===================================================== */

function onPlayerStateChange(event) {

    if (
        event.data ===
        YT.PlayerState.PLAYING
    ) {

        isPlaying = true;

        playButton.textContent =
            "Ⅱ";

        updateSongInformation();

    }


    else if (
        event.data ===
        YT.PlayerState.PAUSED
    ) {

        isPlaying = false;

        playButton.textContent =
            "▶";

    }


    else if (
        event.data ===
        YT.PlayerState.ENDED
    ) {

        isPlaying = false;

        playButton.textContent =
            "▶";

    }


    else if (
        event.data ===
        YT.PlayerState.CUED
    ) {

        updateSongInformation();

    }

}


/* =====================================================
   YOUTUBE ERROR
===================================================== */

function onPlayerError(event) {

    console.error(
        "YouTube player error:",
        event.data
    );

    let message =
        "YouTube playback error";

    switch(event.data) {

        case 2:

            message =
                "Invalid YouTube request";

            break;


        case 5:

            message =
                "HTML5 YouTube player error";

            break;


        case 100:

            message =
                "Video unavailable";

            break;


        case 101:

        case 150:

            message =
                "This video cannot be embedded";

            break;


        case 153:

            message =
                "YouTube rejected the player request";

            break;

    }

    showStatus(
        message
    );

}


/* =====================================================
   PLAY / PAUSE
===================================================== */

playButton.addEventListener(
    "click",
    function () {

        if (!playerReady) {

            showStatus(
                "YouTube is still loading..."
            );

            return;

        }


        if (isPlaying) {

            player.pauseVideo();

        }

        else {

            /*
               Important:
               This happens directly because
               the user clicked the button.
            */

            player.playVideo();

        }

    }
);


/* =====================================================
   PREVIOUS
===================================================== */

previousButton.addEventListener(
    "click",
    function () {

        if (!playerReady) {

            showStatus(
                "Playlist is loading..."
            );

            return;

        }

        try {

            player.previousVideo();

        }

        catch(error) {

            console.error(error);

        }

    }
);


/* =====================================================
   NEXT
===================================================== */

nextButton.addEventListener(
    "click",
    function () {

        if (!playerReady) {

            showStatus(
                "Playlist is loading..."
            );

            return;

        }

        try {

            player.nextVideo();

        }

        catch(error) {

            console.error(error);

        }

    }
);


/* =====================================================
   UPDATE SONG INFORMATION
===================================================== */

function updateSongInformation() {

    if (!playerReady)
        return;


    try {

        const data =
            player.getVideoData();


        if (
            data &&
            data.title
        ) {

            songTitle.textContent =
                data.title;

        }


        if (
            data &&
            data.author
        ) {

            songArtist.textContent =
                data.author;

        }


        if (
            data &&
            data.video_id
        ) {

            coverImage.src =
                "https://i.ytimg.com/vi/" +
                data.video_id +
                "/hqdefault.jpg";

        }

    }

    catch(error) {

        console.log(
            "Waiting for YouTube metadata..."
        );

    }

}


/* =====================================================
   PROGRESS
===================================================== */

function updateProgress() {

    if (!playerReady)
        return;


    try {

        const total =
            player.getDuration();

        const current =
            player.getCurrentTime();


        if (
            total &&
            total > 0
        ) {

            progress.value =
                (
                    current /
                    total
                ) * 100;

            currentTime.textContent =
                formatTime(
                    current
                );

            duration.textContent =
                formatTime(
                    total
                );

        }

    }

    catch(error) {

        // Metadata isn't ready yet.

    }

}

setInterval(
    updateProgress,
    500
);


/* =====================================================
   SEEK
===================================================== */

progress.addEventListener(
    "input",
    function () {

        if (!playerReady)
            return;


        const total =
            player.getDuration();


        if (!total)
            return;


        const position =
            (
                Number(
                    progress.value
                ) / 100
            ) * total;


        player.seekTo(
            position,
            true
        );

    }
);


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(seconds) {

    seconds =
        Math.floor(
            Number(seconds) || 0
        );


    const minutes =
        Math.floor(
            seconds / 60
        );


    const remaining =
        String(
            seconds % 60
        ).padStart(
            2,
            "0"
        );


    return (
        minutes +
        ":" +
        remaining
    );

}

);
