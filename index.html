<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="referrer" content="strict-origin-when-cross-origin">

<title>अटल जिम</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #050505;

    color: #ffffff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================================
   BACKGROUND
========================================================= */

.background {

    position: fixed;

    inset: -5%;

    width: 110%;
    height: 110%;

    z-index: 0;

    background-image:

        linear-gradient(
            rgba(0,0,0,0.05),
            rgba(0,0,0,0.25)
        ),

        url("assets/gym-sidhu.png");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    animation:
        slowZoom
        25s
        ease-in-out
        infinite
        alternate;
}


@keyframes slowZoom {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.035);
    }

    100% {
        transform: scale(1.075);
    }

}


/* =========================================================
   OVERLAY
========================================================= */

.overlay {

    position: fixed;

    inset: 0;

    z-index: 1;

    pointer-events: none;

    background:

        linear-gradient(
            180deg,
            rgba(0,0,0,0.02) 0%,
            rgba(0,0,0,0.03) 45%,
            rgba(0,0,0,0.28) 100%
        );

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar {

    position: fixed;

    top: 28px;

    left: 30px;

    right: 30px;

    z-index: 30;

    display: flex;

    align-items: center;

    justify-content: space-between;

    font-size: 16px;

    font-weight: 700;

    text-shadow:
        0 2px 10px
        rgba(0,0,0,0.9);

}


.clock {

    white-space: nowrap;

}


.online {

    position: absolute;

    left: 50%;

    transform:
        translateX(-50%);

    display: flex;

    align-items: center;

    gap: 9px;

    white-space: nowrap;

}


.online-dot {

    width: 11px;

    height: 11px;

    border-radius: 50%;

    background: #5df58e;

    box-shadow:
        0 0 14px
        rgba(93,245,142,0.9);

}


.top-right {

    display: flex;

    align-items: center;

    gap: 24px;

}


.top-link {

    display: flex;

    align-items: center;

    gap: 8px;

    cursor: pointer;

    opacity: 0.9;

    transition:
        opacity .15s ease,
        transform .15s ease;

}


.top-link:hover {

    opacity: 1;

    transform:
        translateY(-1px);

}


.icon-circle {

    width: 27px;

    height: 27px;

    border:
        1px solid
        rgba(255,255,255,0.75);

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 11px;

}


/* =========================================================
   CENTER LOGO
   50% OF ORIGINAL SIZE
========================================================= */

.logo {

    position: fixed;

    z-index: 10;

    left: 50%;

    top: 47%;

    width:
        min(325px, 29vw);

    transform:
        translate(-50%, -50%);

    pointer-events: none;

    filter:
        drop-shadow(
            0 12px 25px
            rgba(0,0,0,0.35)
        );

}


.logo img {

    display: block;

    width: 100%;

    height: auto;

}


/* =========================================================
   SIDE PREVIOUS / NEXT
========================================================= */

.side-button {

    position: fixed;

    top: 50%;

    z-index: 25;

    width: 48px;

    height: 48px;

    transform:
        translateY(-50%);

    border:
        1px solid
        rgba(255,255,255,0.22);

    border-radius: 50%;

    background:
        rgba(25,20,18,0.25);

    backdrop-filter:
        blur(8px);

    color: #ffffff;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 29px;

    cursor: pointer;

    transition:
        background .1s ease,
        transform .08s ease;

}


.side-button:hover {

    background:
        rgba(25,20,18,0.55);

    transform:
        translateY(-50%)
        scale(1.05);

}


.side-button:active {

    transform:
        translateY(-50%)
        scale(0.85);

}


#previousSide {

    left: 28px;

}


#nextSide {

    right: 28px;

}


/* =========================================================
   MAIN PLAYER
========================================================= */

.player {

    position: fixed;

    z-index: 50;

    left: 50%;

    bottom: 52px;

    transform:
        translateX(-50%);

    width:
        min(650px, calc(100vw - 100px));

    height: 94px;

    padding:
        10px 14px;

    border-radius: 50px;

    background:

        linear-gradient(
            135deg,
            rgba(120,45,35,0.96),
            rgba(94,30,23,0.96)
        );

    box-shadow:

        0 20px 55px
        rgba(0,0,0,0.55),

        inset
        0 1px
        rgba(255,255,255,0.12);

    display: grid;

    grid-template-columns:
        62px
        minmax(0,1fr)
        112px;

    grid-template-rows:
        1fr
        22px;

    column-gap: 13px;

    align-items: center;

}


/* =========================================================
   COVER
========================================================= */

.cover {

    width: 62px;

    height: 62px;

    grid-row:
        1 / 3;

    border-radius: 50%;

    overflow: hidden;

    background:
        #24100d;

    box-shadow:
        0 6px 20px
        rgba(0,0,0,0.4);

}


.cover img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;

}


/* =========================================================
   SONG INFO
========================================================= */

.song-info {

    min-width: 0;

    align-self:
        center;

}


.song-title {

    font-size: 17px;

    line-height: 1.25;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


.song-artist {

    margin-top: 5px;

    font-size: 13px;

    color:
        rgba(255,255,255,0.70);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


/* =========================================================
   CONTROLS
========================================================= */

.controls {

    grid-column: 3;

    grid-row: 1 / 3;

    display: flex;

    align-items: center;

    justify-content: flex-end;

    gap: 10px;

}


/* =========================================================
   PREVIOUS / NEXT
========================================================= */

.control-button {

    width: 24px;

    height: 32px;

    padding: 0;

    border: none;

    background: transparent;

    color: #ffffff;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    font-size: 14px;

    opacity: 0.85;

    transition:
        transform .06s ease,
        opacity .06s ease;

}


.control-button:hover {

    opacity: 1;

}


.control-button:active {

    transform:
        scale(0.72);

}


/* =========================================================
   PLAY / PAUSE
========================================================= */

.play-button {

    width: 46px;

    height: 46px;

    padding: 0;

    border: none;

    border-radius: 50%;

    background: #ffffff;

    color: #17151a;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    font-size: 17px;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,0.22);

    transition:
        transform .06s ease;

}


.play-button:hover {

    transform:
        scale(1.04);

}


.play-button:active {

    transform:
        scale(0.84);

}


/* =========================================================
   PROGRESS
========================================================= */

.progress-area {

    grid-column: 2;

    grid-row: 2;

    display: grid;

    grid-template-columns:
        30px
        minmax(0,1fr)
        35px;

    align-items: center;

    gap: 7px;

}


.time {

    font-size: 10px;

    color:
        rgba(255,255,255,0.72);

}


.progress {

    width: 100%;

    height: 4px;

    appearance: none;

    border: none;

    border-radius: 10px;

    background:
        rgba(255,255,255,0.30);

    cursor: pointer;

}


.progress::-webkit-slider-thumb {

    appearance: none;

    width: 8px;

    height: 8px;

    border: none;

    border-radius: 50%;

    background: #ffffff;

}


.progress::-moz-range-thumb {

    width: 8px;

    height: 8px;

    border: none;

    border-radius: 50%;

    background: #ffffff;

}


/* =========================================================
   PLAYLIST MENU
========================================================= */

.menu-button {

    position: absolute;

    right: -52px;

    top: 50%;

    transform:
        translateY(-50%);

    width: 42px;

    height: 42px;

    border:
        1px solid
        rgba(255,255,255,0.22);

    border-radius: 50%;

    background:
        rgba(20,15,13,0.30);

    color: #ffffff;

    font-size: 17px;

    cursor: pointer;

}


.menu-button:hover {

    background:
        rgba(20,15,13,0.55);

}


/* =========================================================
   PLAYLIST PANEL
========================================================= */

.playlist-panel {

    position: fixed;

    z-index: 45;

    right: 35px;

    bottom: 165px;

    width: 350px;

    max-height: 390px;

    padding: 20px;

    border-radius: 18px;

    background:
        rgba(18,14,12,0.94);

    border:
        1px solid
        rgba(255,255,255,0.12);

    backdrop-filter:
        blur(18px);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,0.60);

    opacity: 0;

    visibility: hidden;

    transform:
        translateY(12px);

    transition:
        opacity .15s ease,
        transform .15s ease,
        visibility .15s ease;

}


.playlist-panel.open {

    opacity: 1;

    visibility: visible;

    transform:
        translateY(0);

}


.playlist-title {

    font-size: 12px;

    letter-spacing:
        .14em;

    color:
        rgba(255,255,255,0.55);

    margin-bottom: 14px;

}


.playlist-info {

    font-size: 12px;

    line-height: 1.7;

    color:
        rgba(255,255,255,0.65);

}


/* =========================================================
   STATUS
========================================================= */

.status {

    position: fixed;

    left: 50%;

    top: 70%;

    transform:
        translate(-50%,-50%);

    z-index: 100;

    padding:
        8px 16px;

    border-radius: 30px;

    background:
        rgba(0,0,0,0.65);

    backdrop-filter:
        blur(10px);

    font-size: 11px;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .12s ease;

}


.status.show {

    opacity: 1;

}


/* =========================================================
   HIDDEN YOUTUBE PLAYER
========================================================= */

#youtube-player {

    position: fixed;

    left: -1000px;

    top: -1000px;

    width: 320px;

    height: 180px;

    opacity: 0;

    pointer-events: none;

}


/* =========================================================
   FOOTER
========================================================= */

.signature {

    position: fixed;

    z-index: 100;

    left: 50%;

    bottom: 9px;

    transform:
        translateX(-50%);

    font-size: 11px;

    color:
        rgba(255,255,255,0.80);

    white-space: nowrap;

    text-shadow:
        0 2px 10px
        rgba(0,0,0,0.9);

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px) {


    .topbar {

        top: 14px;

        left: 15px;

        right: 15px;

    }


    .online {

        display: none;

    }


    .top-right {

        gap: 10px;

    }


    .top-link {

        font-size: 11px;

    }


    .logo {

        width:
            45vw;

    }


    .side-button {

        width: 40px;

        height: 40px;

        font-size: 25px;

    }


    #previousSide {

        left: 8px;

    }


    #nextSide {

        right: 8px;

    }


    .player {

        width:
            calc(100vw - 30px);

        height: 86px;

        bottom: 34px;

        padding:
            9px 11px;

        grid-template-columns:
            52px
            minmax(0,1fr)
            105px;

        column-gap: 8px;

    }


    .cover {

        width: 52px;

        height: 52px;

    }


    .song-title {

        font-size: 13px;

    }


    .song-artist {

        font-size: 10px;

    }


    .controls {

        gap: 5px;

    }


    .control-button {

        width: 19px;

        font-size: 12px;

    }


    .play-button {

        width: 40px;

        height: 40px;

        font-size: 15px;

    }


    .menu-button {

        display: none;

    }


    .playlist-panel {

        left: 15px;

        right: 15px;

        width: auto;

        bottom: 130px;

    }


    .signature {

        font-size: 9px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="background"></div>

<div class="overlay"></div>


<!-- =====================================================
     TOP BAR
===================================================== -->

<div class="topbar">


    <div
        class="clock"
        id="clock">

        11:13 am

    </div>


    <div class="online">

        <span class="online-dot"></span>

        <span>
            listening now
        </span>

    </div>


    <div class="top-right">


        <div
            class="top-link"
            id="ytMusicButton">

            <span class="icon-circle">
                ▶
            </span>

            YT Music

        </div>


        <div
            class="top-link"
            id="openPlaylistButton">

            <span class="icon-circle">
                ☰
            </span>

            Playlist

        </div>


    </div>

</div>


<!-- =====================================================
     CENTER LOGO
===================================================== -->

<div class="logo">

    <img
        src="assets/atal-logo.png"
        alt="अटल जिम">

</div>


<!-- =====================================================
     SIDE PREVIOUS
===================================================== -->

<button
    class="side-button"
    id="previousSide"
    aria-label="Previous song">

    ‹

</button>


<!-- =====================================================
     SIDE NEXT
===================================================== -->

<button
    class="side-button"
    id="nextSide"
    aria-label="Next song">

    ›

</button>


<!-- =====================================================
     PLAYLIST INFO PANEL
===================================================== -->

<div
    class="playlist-panel"
    id="playlistPanel">

    <div class="playlist-title">

        SIDHU MOOSEWALA PLAYLIST

    </div>


    <div class="playlist-info">

        You are listening to the
        YouTube Music playlist.

        <br><br>

        Use the controls below to
        play, pause, skip and seek.

        <br><br>

        Playlist ID:

        <br>

        PLOfpK4YHqoMg

    </div>

</div>


<!-- =====================================================
     CUSTOM PLAYER
===================================================== -->

<div class="player">


    <!-- COVER -->

    <div class="cover">

        <img
            id="coverImage"
            src="assets/gym-sidhu.png"
            alt="Music">

    </div>


    <!-- SONG INFO -->

    <div class="song-info">


        <div
            class="song-title"
            id="songTitle">

            Sidhu Moosewala

        </div>


        <div
            class="song-artist"
            id="songArtist">

            YouTube Music Playlist

        </div>


    </div>


    <!-- PROGRESS -->

    <div class="progress-area">


        <span
            class="time"
            id="currentTime">

            0:00

        </span>


        <input
            class="progress"
            id="progress"
            type="range"
            min="0"
            max="100"
            value="0"
            aria-label="Song progress"
        >


        <span
            class="time"
            id="duration">

            0:00

        </span>


    </div>


    <!-- CONTROLS -->

    <div class="controls">


        <button
            class="control-button"
            id="previousButton"
            aria-label="Previous song">

            |◀

        </button>


        <button
            class="play-button"
            id="playButton"
            aria-label="Play">

            ▶

        </button>


        <button
            class="control-button"
            id="nextButton"
            aria-label="Next song">

            ▶|

        </button>


    </div>


    <!-- PLAYLIST MENU -->

    <button
        class="menu-button"
        id="menuButton"
        aria-label="Playlist">

        ☰

    </button>


</div>


<!-- =====================================================
     STATUS
===================================================== -->

<div
    class="status"
    id="status">
</div>


<!-- =====================================================
     FOOTER
===================================================== -->

<div class="signature">

    Made with 💖 from Gaurav

</div>


<!-- =====================================================
     HIDDEN YOUTUBE PLAYER
===================================================== -->

<div id="youtube-player"></div>


<script>

/* =========================================================
   PLAYLIST
========================================================= */

const PLAYLIST_ID =
    "PLOfpK4YHqoMg";


/* =========================================================
   PLAYER VARIABLES
========================================================= */

let player = null;

let playerReady = false;

let isPlaying = false;

let statusTimer = null;


/* =========================================================
   ELEMENTS
========================================================= */

const playButton =
    document.getElementById(
        "playButton"
    );


const previousButton =
    document.getElementById(
        "previousButton"
    );


const nextButton =
    document.getElementById(
        "nextButton"
    );


const previousSide =
    document.getElementById(
        "previousSide"
    );


const nextSide =
    document.getElementById(
        "nextSide"
    );


const songTitle =
    document.getElementById(
        "songTitle"
    );


const songArtist =
    document.getElementById(
        "songArtist"
    );


const coverImage =
    document.getElementById(
        "coverImage"
    );


const progress =
    document.getElementById(
        "progress"
    );


const currentTime =
    document.getElementById(
        "currentTime"
    );


const duration =
    document.getElementById(
        "duration"
    );


const status =
    document.getElementById(
        "status"
    );


const playlistPanel =
    document.getElementById(
        "playlistPanel"
    );


/* =========================================================
   CLOCK
========================================================= */

function updateClock() {

    const now =
        new Date();


    let hours =
        now.getHours();


    const minutes =
        String(
            now.getMinutes()
        ).padStart(
            2,
            "0"
        );


    const period =
        hours >= 12
            ? "pm"
            : "am";


    hours =
        hours % 12 || 12;


    document.getElementById(
        "clock"
    ).textContent =
        `${hours}:${minutes} ${period}`;

}


updateClock();


setInterval(
    updateClock,
    1000
);


/* =========================================================
   STATUS
========================================================= */

function showStatus(message) {

    status.textContent =
        message;


    status.classList.add(
        "show"
    );


    clearTimeout(
        statusTimer
    );


    statusTimer =
        setTimeout(
            function() {

                status.classList.remove(
                    "show"
                );

            },
            1600
        );

}


/* =========================================================
   YOUTUBE API READY
========================================================= */

window.onYouTubeIframeAPIReady =
function() {


    player =
        new YT.Player(
            "youtube-player",
            {

                width: "320",

                height: "180",

                playerVars: {

                    autoplay: 0,

                    controls: 0,

                    playsinline: 1,

                    rel: 0,

                    listType:
                        "playlist",

                    list:
                        PLAYLIST_ID,

                    loop: 1,

                    enablejsapi: 1,

                    origin:
                        window.location.origin

                },


                events: {

                    onReady:
                        onPlayerReady,

                    onStateChange:
                        onPlayerStateChange,

                    onError:
                        onPlayerError

                }

            }
        );

};


/* =========================================================
   PLAYER READY
========================================================= */

function onPlayerReady() {

    playerReady = true;


    try {

        player.cuePlaylist({

            listType:
                "playlist",

            list:
                PLAYLIST_ID,

            index: 0

        });

    }

    catch(error) {

        console.error(
            error
        );

    }


    showStatus(
        "Playlist ready"
    );

}


/* =========================================================
   STATE CHANGE
========================================================= */

function onPlayerStateChange(event) {


    if (
        event.data ===
        YT.PlayerState.PLAYING
    ) {

        isPlaying = true;


        playButton.textContent =
            "Ⅱ";


        updateSongInfo();

    }


    else if (
        event.data ===
        YT.PlayerState.PAUSED
    ) {

        isPlaying = false;


        playButton.textContent =
            "▶";

    }


    else if (
        event.data ===
        YT.PlayerState.ENDED
    ) {

        isPlaying = false;


        playButton.textContent =
            "▶";

    }


    else if (
        event.data ===
        YT.PlayerState.CUED
    ) {

        updateSongInfo();

    }

}


/* =========================================================
   PLAYER ERROR
========================================================= */

function onPlayerError(event) {

    console.error(
        "YouTube player error:",
        event.data
    );


    let message =
        "YouTube playback error";


    if (event.data === 2) {

        message =
            "Invalid playlist request";

    }


    else if (event.data === 5) {

        message =
            "HTML5 player error";

    }


    else if (event.data === 100) {

        message =
            "Video unavailable";

    }


    else if (
        event.data === 101 ||
        event.data === 150
    ) {

        message =
            "This video cannot be embedded";

    }


    else if (event.data === 153) {

        message =
            "YouTube rejected the player request";

    }


    showStatus(
        message
    );

}


/* =========================================================
   PLAY / PAUSE
========================================================= */

function togglePlay() {


    if (
        !playerReady ||
        !player
    ) {

        showStatus(
            "YouTube is loading..."
        );

        return;

    }


    if (isPlaying) {


        /*
         * Change the UI immediately.
         */

        isPlaying = false;


        playButton.textContent =
            "▶";


        player.pauseVideo();


    }

    else {


        /*
         * Change the UI immediately.
         */

        isPlaying = true;


        playButton.textContent =
            "Ⅱ";


        player.playVideo();

    }

}


playButton.addEventListener(
    "click",
    togglePlay
);


/* =========================================================
   PREVIOUS
========================================================= */

function previousSong() {


    if (
        !playerReady ||
        !player
    ) {

        showStatus(
            "YouTube is loading..."
        );

        return;

    }


    /*
     * Immediate button response.
     */

    previousButton.style.transform =
        "scale(.72)";


    setTimeout(
        function() {

            previousButton.style.transform =
                "";

        },
        70
    );


    try {

        player.previousVideo();

    }

    catch(error) {

        console.error(
            "Previous error:",
            error
        );

    }

}


/* =========================================================
   NEXT
========================================================= */

function nextSong() {


    if (
        !playerReady ||
        !player
    ) {

        showStatus(
            "YouTube is loading..."
        );

        return;

    }


    /*
     * Immediate button response.
     */

    nextButton.style.transform =
        "scale(.72)";


    setTimeout(
        function() {

            nextButton.style.transform =
                "";

        },
        70
    );


    try {

        player.nextVideo();

    }

    catch(error) {

        console.error(
            "Next error:",
            error
        );

    }

}


/* =========================================================
   BUTTON EVENTS
========================================================= */

previousButton.addEventListener(
    "click",
    previousSong
);


nextButton.addEventListener(
    "click",
    nextSong
);


previousSide.addEventListener(
    "click",
    previousSong
);


nextSide.addEventListener(

/* =========================================================
   SONG INFORMATION
========================================================= */

function updateSongInfo() {


    if (
        !playerReady ||
        !player
    ) {

        return;

    }


    try {


        const data =
            player.getVideoData();


        if (
            data &&
            data.title
        ) {

            songTitle.textContent =
                data.title;

        }


        if (
            data &&
            data.author
        ) {

            songArtist.textContent =
                data.author;

        }


        if (
            data &&
            data.video_id
        ) {

            coverImage.src =
                "https://i.ytimg.com/vi/" +
                data.video_id +
                "/hqdefault.jpg";

        }


    }

    catch(error) {

        console.log(
            "Song metadata not ready."
        );

    }

}


/* =========================================================
   PROGRESS UPDATE
========================================================= */

function updateProgress() {


    if (
        !playerReady ||
        !player
    ) {

        return;

    }


    try {


        const total =
            player.getDuration();


        const current =
            player.getCurrentTime();


        if (
            total &&
            total > 0
        ) {


            progress.value =
                (
                    current /
                    total
                ) * 100;


            currentTime.textContent =
                formatTime(
                    current
                );


            duration.textContent =
                formatTime(
                    total
                );

        }


    }

    catch(error) {

        // Player may still be loading.

    }

}


setInterval(
    updateProgress,
    400
);


/* =========================================================
   SEEK
========================================================= */

progress.addEventListener(
    "input",
    function() {


        if (
            !playerReady ||
            !player
        ) {

            return;

        }


        try {


            const total =
                player.getDuration();


            if (!total) {

                return;

            }


            const target =
                (
                    Number(
                        progress.value
                    ) / 100
                ) * total;


            player.seekTo(
                target,
                true
            );


        }

        catch(error) {

            console.error(
                "Seek error:",
                error
            );

        }

    }
);


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(seconds) {


    seconds =
        Math.floor(
            Number(seconds) || 0
        );


    const minutes =
        Math.floor(
            seconds / 60
        );


    const remaining =
        String(
            seconds % 60
        ).padStart(
            2,
            "0"
        );


    return (
        minutes +
        ":" +
        remaining
    );

}

   PLAYLIST MENU

    );

   YOUTUBE MUSIC BUTTON
========================================================= */

    )

/* =========================================================
   KEYBOARD CONTROLS
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.target.tagName ===
            "INPUT"
        ) {

            return;

        }


        /*
         * SPACE
         */

        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();

            togglePlay();

        }


        /*
         * LEFT ARROW
         */

        if (
            event.key ===
            "ArrowLeft"
        ) {

            previousSong();

        }


        /*
         * RIGHT ARROW
         */

        if (
            event.key ===
            "ArrowRight"
        ) {

            nextSong();

        }


        /*
         * ESC
         */

        if (
            event.key ===
            "Escape"
        ) {

            playlistPanel.classList.remove(
                "open"
            );

        }

    }
);


/* =========================================================
   LOAD YOUTUBE IFRAME API
========================================================= */

const youtubeScript =
    document.createElement(
        "script"
    );


youtubeScript.src =
    "https://www.youtube.com/iframe_api";


youtubeScript.async = true;


document.head.appendChild(
    youtubeScript
);

</script>
