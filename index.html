<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">

<title>अटल जिम</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #050505;
    color: #fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================================
   BACKGROUND
========================================================= */

.background {
    position: fixed;

    inset: -6%;

    width: 112%;
    height: 112%;

    background-image:
        linear-gradient(
            rgba(0,0,0,0.08),
            rgba(0,0,0,0.25)
        ),
        url("assets/gym-sidhu.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    z-index: 0;

    animation:
        backgroundZoom 24s
        ease-in-out
        infinite
        alternate;
}

@keyframes backgroundZoom {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.035);
    }

    100% {
        transform: scale(1.075);
    }
}


/* =========================================================
   DARK OVERLAY
========================================================= */

.overlay {
    position: fixed;

    inset: 0;

    z-index: 1;

    pointer-events: none;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,0.03) 0%,
            rgba(0,0,0,0.02) 45%,
            rgba(0,0,0,0.30) 100%
        );
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar {
    position: fixed;

    top: 28px;
    left: 30px;
    right: 30px;

    z-index: 30;

    display: flex;
    align-items: center;
    justify-content: space-between;

    font-size: 16px;
    font-weight: 700;

    text-shadow:
        0 2px 10px rgba(0,0,0,0.8);
}

.clock {
    white-space: nowrap;
}


.online {
    position: absolute;

    left: 50%;

    transform:
        translateX(-50%);

    display: flex;
    align-items: center;

    gap: 9px;

    white-space: nowrap;
}

.online-dot {
    width: 11px;
    height: 11px;

    border-radius: 50%;

    background: #5df58e;

    box-shadow:
        0 0 14px
        rgba(93,245,142,0.9);
}


.top-right {
    display: flex;

    align-items: center;

    gap: 24px;
}


.top-link {
    display: flex;

    align-items: center;

    gap: 8px;

    cursor: pointer;

    opacity: 0.9;

    transition:
        opacity 0.15s ease,
        transform 0.15s ease;
}

.top-link:hover {
    opacity: 1;

    transform:
        translateY(-1px);
}


.icon-circle {
    width: 27px;
    height: 27px;

    display: flex;
    align-items: center;
    justify-content: center;

    border:
        1px solid
        rgba(255,255,255,0.7);

    border-radius: 50%;

    font-size: 11px;
}


/* =========================================================
   CENTER LOGO
========================================================= */

.logo {
    position: fixed;

    z-index: 10;

    left: 50%;
    top: 48%;

    width:
        min(650px, 58vw);

    transform:
        translate(-50%, -50%);

    pointer-events: none;

    filter:
        drop-shadow(
            0 12px 25px
            rgba(0,0,0,0.35)
        );
}

.logo img {
    width: 100%;
    height: auto;

    display: block;
}


/* =========================================================
   SIDE PREVIOUS / NEXT
========================================================= */

.side-button {
    position: fixed;

    top: 50%;

    z-index: 25;

    width: 48px;
    height: 48px;

    transform:
        translateY(-50%);

    border:
        1px solid
        rgba(255,255,255,0.20);

    border-radius: 50%;

    background:
        rgba(25,20,18,0.30);

    backdrop-filter:
        blur(8px);

    color: #fff;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 29px;
    font-weight: 300;

    cursor: pointer;

    transition:
        transform 0.10s ease,
        background 0.10s ease;
}

.side-button:hover {
    background:
        rgba(25,20,18,0.55);

    transform:
        translateY(-50%)
        scale(1.05);
}

.side-button:active {
    transform:
        translateY(-50%)
        scale(0.88);
}

#previousSide {
    left: 28px;
}

#nextSide {
    right: 28px;
}


/* =========================================================
   PLAYER
========================================================= */

.player {
    position: fixed;

    z-index: 50;

    left: 50%;
    bottom: 56px;

    transform:
        translateX(-50%);

    width:
        min(760px, calc(100vw - 100px));

    height: 104px;

    padding:
        11px 13px;

    border-radius: 55px;

    background:
        linear-gradient(
            135deg,
            rgba(151,48,37,0.97),
            rgba(105,28,22,0.97)
        );

    box-shadow:
        0 25px 65px
        rgba(0,0,0,0.55),

        inset
        0 1px
        rgba(255,255,255,0.16);

    display: grid;

    grid-template-columns:
        70px
        minmax(0, 1fr)
        115px;

    grid-template-rows:
        1fr
        22px;

    column-gap: 14px;

    align-items: center;
}


/* =========================================================
   COVER
========================================================= */

.cover {
    width: 70px;
    height: 70px;

    grid-row: 1 / 3;

    border-radius: 50%;

    overflow: hidden;

    background: #210b08;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.45);
}

.cover img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}


/* =========================================================
   SONG INFO
========================================================= */

.song-info {
    min-width: 0;

    align-self: center;
}

.song-title {
    font-size: 18px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.song-artist {
    margin-top: 5px;

    font-size: 13px;

    color:
        rgba(255,255,255,0.70);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================================================
   SMALL SALOON STYLE CONTROL
========================================================= */

.control-pill {
    width: 112px;
    height: 48px;

    border-radius: 28px;

    background:
        rgba(31,29,35,0.96);

    border:
        1px solid
        rgba(255,255,255,0.12);

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 8px;

    flex-shrink: 0;

    box-shadow:
        0 8px 22px
        rgba(0,0,0,0.25);
}


/* PREVIOUS / NEXT */

.control-small {
    width: 22px;
    height: 32px;

    padding: 0;

    border: 0;

    background: transparent;

    color: #fff;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;

    font-size: 15px;

    opacity: 0.82;

    transition:
        transform 0.08s ease,
        opacity 0.08s ease;
}

.control-small:hover {
    opacity: 1;
}

.control-small:active {
    transform: scale(0.82);
}


/* =========================================================
   PLAY / PAUSE
========================================================= */

.play-button {
    width: 40px;
    height: 40px;

    padding: 0;

    border: none;

    border-radius: 50%;

    background: #fff;

    color: #17151a;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;

    font-size: 16px;

    flex-shrink: 0;

    transition:
        transform 0.08s ease;
}

.play-button:hover {
    transform: scale(1.04);
}

.play-button:active {
    transform: scale(0.88);
}


/* =========================================================
   PROGRESS
========================================================= */

.progress-area {
    grid-column: 2 / 4;

    display: grid;

    grid-template-columns:
        35px
        minmax(0, 1fr)
        35px;

    gap: 8px;

    align-items: center;
}

.time {
    font-size: 10px;

    color:
        rgba(255,255,255,0.70);
}

.progress {
    width: 100%;
    height: 4px;

    appearance: none;

    border: none;

    border-radius: 10px;

    background:
        rgba(255,255,255,0.30);

    cursor: pointer;
}

.progress::-webkit-slider-thumb {
    appearance: none;

    width: 9px;
    height: 9px;

    border: none;

    border-radius: 50%;

    background: #fff;

    cursor: pointer;
}

.progress::-moz-range-thumb {
    width: 9px;
    height: 9px;

    border: none;

    border-radius: 50%;

    background: #fff;

    cursor: pointer;
}


/* =========================================================
   PLAYLIST MENU BUTTON
========================================================= */

.menu-button {
    position: absolute;

    right: -53px;

    top: 50%;

    width: 42px;
    height: 42px;

    transform:
        translateY(-50%);

    border:
        1px solid
        rgba(255,255,255,0.22);

    border-radius: 50%;

    background:
        rgba(20,15,13,0.30);

    color: #fff;

    font-size: 17px;

    cursor: pointer;

    transition:
        transform 0.1s ease,
        background 0.1s ease;
}

.menu-button:hover {
    background:
        rgba(20,15,13,0.55);

    transform:
        translateY(-50%)
        scale(1.05);
}


/* =========================================================
   PLAYLIST PANEL
========================================================= */

.playlist-panel {
    position: fixed;

    z-index: 45;

    right: 35px;

    bottom: 178px;

    width: 360px;

    max-height: 390px;

    overflow-y: auto;

    padding: 21px;

    border-radius: 20px;

    background:
        rgba(18,14,12,0.94);

    border:
        1px solid
        rgba(255,255,255,0.13);

    backdrop-filter:
        blur(18px);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,0.60);

    opacity: 0;

    visibility: hidden;

    transform:
        translateY(12px);

    transition:
        opacity 0.18s ease,
        transform 0.18s ease,
        visibility 0.18s ease;
}

.playlist-panel.open {
    opacity: 1;

    visibility: visible;

    transform:
        translateY(0);
}

.playlist-title {
    font-size: 12px;

    letter-spacing: 0.14em;

    color:
        rgba(255,255,255,0.55);

    margin-bottom: 15px;
}

.playlist-info {
    font-size: 12px;

    line-height: 1.7;

    color:
        rgba(255,255,255,0.65);
}


/* =========================================================
   STATUS
========================================================= */

.status {
    position: fixed;

    left: 50%;
    top: 72%;

    transform:
        translate(-50%, -50%);

    z-index: 100;

    padding:
        8px 17px;

    border-radius: 30px;

    background:
        rgba(0,0,0,0.60);

    backdrop-filter:
        blur(10px);

    font-size: 11px;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 0.15s ease;
}

.status.show {
    opacity: 1;
}


/* =========================================================
   HIDDEN YOUTUBE PLAYER
========================================================= */

#youtube-player {
    position: fixed;

    left: -1000px;
    top: -1000px;

    width: 320px;
    height: 180px;

    opacity: 0;

    pointer-events: none;
}


/* =========================================================
   FOOTER
========================================================= */

.signature {
    position: fixed;

    z-index: 100;

    left: 50%;

    bottom: 11px;

    transform:
        translateX(-50%);

    font-size: 11px;

    color:
        rgba(255,255,255,0.78);

    white-space: nowrap;

    text-shadow:
        0 2px 10px
        rgba(0,0,0,0.9);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 800px) {

    .topbar {
        top: 15px;
        left: 15px;
        right: 15px;
    }

    .online {
        display: none;
    }

    .top-right {
        gap: 10px;
    }

    .top-link {
        font-size: 11px;
    }

    .logo {
        width: 78vw;
    }

    .side-button {
        width: 42px;
        height: 42px;

        font-size: 25px;
    }

    #previousSide {
        left: 9px;
    }

    #nextSide {
        right: 9px;
    }

    .player {
        width:
            calc(100vw - 30px);

        height: 90px;

        bottom: 35px;

        grid-template-columns:
            58px
            minmax(0, 1fr)
            112px;

        column-gap: 9px;

        border-radius: 50px;
    }

    .cover {
        width: 58px;
        height: 58px;
    }

    .song-title {
        font-size: 14px;
    }

    .song-artist {
        font-size: 10px;
    }

    .control-pill {
        width: 108px;
        height: 45px;

        gap: 6px;
    }

    .play-button {
        width: 37px;
        height: 37px;

        font-size: 15px;
    }

    .control-small {
        font-size: 14px;
    }

    .menu-button {
        display: none;
    }

    .playlist-panel {
        left: 15px;
        right: 15px;

        width: auto;

        bottom: 140px;
    }

    .signature {
        font-size: 9px;
    }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion: reduce) {

    .background {
        animation: none;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="background"></div>

<div class="overlay"></div>


<!-- =====================================================
     TOP BAR
===================================================== -->

<div class="topbar">

    <div
        class="clock"
        id="clock">
        11:13 am
    </div>


    <div class="online">

        <span class="online-dot"></span>

        <span>
            listening now
        </span>

    </div>


    <div class="top-right">

        <div
            class="top-link"
            id="spotifyButton">

            <span class="icon-circle">
                S
            </span>

            Spotify

        </div>


        <div
            class="top-link"
            id="ytMusicButton">

            <span class="icon-circle">
                ▶
            </span>

            YT Music

        </div>

    </div>

</div>


<!-- =====================================================
     CENTER LOGO
===================================================== -->

<div class="logo">

    <img
        src="assets/atal-logo.png"
        alt="अटल जिम">

</div>


<!-- =====================================================
     SIDE NAVIGATION
===================================================== -->

<button
    class="side-button"
    id="previousSide"
    aria-label="Previous song">

    ‹

</button>


<button
    class="side-button"
    id="nextSide"
    aria-label="Next song">

    ›

</button>


<!-- =====================================================
     PLAYLIST PANEL
===================================================== -->

<div
    class="playlist-panel"
    id="playlistPanel">

    <div class="playlist-title">
        SIDHU MOOSEWALA PLAYLIST
    </div>

    <div class="playlist-info">

        You are listening to the
        Sidhu Moosewala playlist.

        <br><br>

        Use the player controls to
        switch between songs.

        <br><br>

        Previous and Next use the
        YouTube playlist directly.

    </div>

</div>


<!-- =====================================================
     PLAYER
===================================================== -->

<div class="player">


    <!-- COVER -->

    <div class="cover">

        <img
            id="coverImage"
            src="assets/gym-sidhu.png"
            alt="Sidhu Moosewala">

    </div>


    <!-- SONG INFORMATION -->

    <div class="song-info">

        <div
            class="song-title"
            id="songTitle">

            Sidhu Moosewala Playlist

        </div>

        <div
            class="song-artist"
            id="songArtist">

            Sidhu Moosewala

        </div>

    </div>


    <!-- =================================================
         SMALL CONTROL PILL
    ================================================== -->

    <div class="control-pill">


        <!-- PREVIOUS -->

        <button
            class="control-small"
            id="previousButton"
            aria-label="Previous song">

            |◀

        </button>


        <!-- PLAY / PAUSE -->

        <button
            class="play-button"
            id="playButton"
            aria-label="Play">

            ▶

        </button>


        <!-- NEXT -->

        <button
            class="control-small"
            id="nextButton"
            aria-label="Next song">

            ▶|

        </button>


    </div>


    <!-- =================================================
         PROGRESS BAR
    ================================================== -->

    <div class="progress-area">

        <span
            class="time"
            id="currentTime">

            0:00

        </span>


        <input
            class="progress"
            id="progress"
            type="range"
            min="0"
            max="100"
            value="0"
            aria-label="Song progress">


        <span
            class="time"
            id="duration">

            0:00

        </span>

    </div>


    <!-- PLAYLIST MENU -->

    <button
        class="menu-button"
        id="menuButton"
        aria-label="Playlist">

        ☰

    </button>


</div>


<!-- =====================================================
     STATUS
===================================================== -->

<div
    class="status"
    id="status">
</div>


<!-- =====================================================
     SIGNATURE
===================================================== -->

<div class="signature">

    Made with 💖 from Gaurav

</div>


<!-- =====================================================
     YOUTUBE PLAYER
===================================================== -->

<div id="youtube-player"></div>


<script>

/* =========================================================
   PLAYLIST
========================================================= */

const PLAYLIST_ID =
    "PL61b1x9YzrKU-5RwcdWd3ygy2-4Aiznjg";


/* =========================================================
   PLAYER VARIABLES
========================================================= */

let player = null;

let playerReady = false;

let isPlaying = false;

let statusTimer = null;


/* =========================================================
   ELEMENTS
========================================================= */

const playButton =
    document.getElementById(
        "playButton"
    );

const previousButton =
    document.getElementById(
        "previousButton"
    );

const nextButton =
    document.getElementById(
        "nextButton"
    );

const previousSide =
    document.getElementById(
        "previousSide"
    );

const nextSide =
    document.getElementById(
        "nextSide"
    );

const songTitle =
    document.getElementById(
        "songTitle"
    );

const songArtist =
    document.getElementById(
        "songArtist"
    );

const coverImage =
    document.getElementById(
        "coverImage"
    );

const progress =
    document.getElementById(
        "progress"
    );

const currentTime =
    document.getElementById(
        "currentTime"
    );

const duration =
    document.getElementById(
        "duration"
    );

const status =
    document.getElementById(
        "status"
    );

const playlistPanel =
    document.getElementById(
        "playlistPanel"
    );


/* =========================================================
   CLOCK
========================================================= */

function updateClock() {

    const now =
        new Date();

    let hours =
        now.getHours();

    const minutes =
        String(
            now.getMinutes()
        ).padStart(
            2,
            "0"
        );

    const period =
        hours >= 12
            ? "pm"
            : "am";

    hours =
        hours % 12 || 12;

    document.getElementById(
        "clock"
    ).textContent =
        `${hours}:${minutes} ${period}`;

}

updateClock();

setInterval(
    updateClock,
    1000
);


/* =========================================================
   STATUS MESSAGE
========================================================= */

function showStatus(message) {

    status.textContent =
        message;

    status.classList.add(
        "show"
    );

    clearTimeout(
        statusTimer
    );

    statusTimer =
        setTimeout(
            function() {

                status.classList.remove(
                    "show"
                );

            },
            1800
        );

}


/* =========================================================
   YOUTUBE API
========================================================= */

window.onYouTubeIframeAPIReady =
function() {

    player =
        new YT.Player(
            "youtube-player",
            {

                width: "320",

                height: "180",

                playerVars: {

                    autoplay: 0,

                    controls: 0,

                    playsinline: 1,

                    rel: 0,

                    modestbranding: 1,

                    listType:
                        "playlist",

                    list:
                        PLAYLIST_ID,

                    loop: 1,

                    enablejsapi: 1,

                    origin:
                        window.location.origin

                },

                events: {

                    onReady:
                        onPlayerReady,

                    onStateChange:
                        onPlayerStateChange,

                    onError:
                        onPlayerError

                }

            }
        );

};


/* =========================================================
   PLAYER READY
========================================================= */

function onPlayerReady() {

    playerReady = true;

    try {

        player.cuePlaylist({

            listType:
                "playlist",

            list:
                PLAYLIST_ID,

            index: 0

        });

    }

    catch(error) {

        console.error(
            error
        );

    }

}


/* =========================================================
   PLAYER STATE
========================================================= */

function onPlayerStateChange(event) {

    if (
        event.data ===
        YT.PlayerState.PLAYING
    ) {

        isPlaying = true;

        playButton.textContent =
            "Ⅱ";

        updateSongInfo();

    }


    else if (
        event.data ===
        YT.PlayerState.PAUSED
    ) {

        isPlaying = false;

        playButton.textContent =
            "▶";

    }


    else if (
        event.data ===
        YT.PlayerState.ENDED
    ) {

        isPlaying = false;

        playButton.textContent =
            "▶";

    }


    else if (
        event.data ===
        YT.PlayerState.CUED
    ) {

        updateSongInfo();

    }

}


/* =========================================================
   YOUTUBE ERROR
========================================================= */

function onPlayerError(event) {

    console.error(
        "YouTube error:",
        event.data
    );

    let message =
        "YouTube playback error";


    if (event.data === 2) {

        message =
            "Invalid YouTube request";

    }


    if (event.data === 5) {

        message =
            "HTML5 player error";

    }


    if (event.data === 100) {

        message =
            "Video unavailable";

    }


    if (
        event.data === 101 ||
        event.data === 150
    ) {

        message =
            "Video cannot be embedded";

    }


    if (event.data === 153) {

        message =
            "YouTube rejected the player request";

    }


    showStatus(
        message
    );

}


/* =========================================================
   PLAY / PAUSE
========================================================= */

playButton.addEventListener(
    "click",
    function() {

        if (
            !playerReady ||
            !player
        ) {

            showStatus(
                "YouTube is loading..."
            );

            return;

        }


        if (isPlaying) {

            /*
             * Update UI immediately.
             */

            isPlaying = false;

            playButton.textContent =
                "▶";

            player.pauseVideo();

        }

        else {

            /*
             * Update UI immediately.
             */

            isPlaying = true;

            playButton.textContent =
                "Ⅱ";

            player.playVideo();

        }

    }
);


/* =========================================================
   PREVIOUS
========================================================= */

function previousSong() {

    if (
        !playerReady ||
        !player
    ) {

        showStatus(
            "YouTube is loading..."
        );

        return;

    }


    /*
     * Instant button feedback.
     */

    previousButton.style.transform =
        "scale(0.82)";


    setTimeout(
        function() {

            previousButton.style.transform =
                "";

        },
        80
    );


    try {

        player.previousVideo();

    }

    catch(error) {

        console.error(
            "Previous error:",
            error
        );

    }

}


/* =========================================================
   NEXT
========================================================= */

function nextSong() {

    if (
        !playerReady ||
        !player
    ) {

        showStatus(
            "YouTube is loading..."
        );

        return;

    }


    /*
     * Instant button feedback.
     */

    nextButton.style.transform =
        "scale(0.82)";


    setTimeout(
        function() {

            nextButton.style.transform =
                "";

        },
        80
    );


    try {

        player.nextVideo();

    }

    catch(error) {

        console.error(
            "Next error:",
            error
        );

    }

}


/* =========================================================
   PLAYER CONTROLS
========================================================= */

previousButton.addEventListener(
    "click",
    previousSong
);

nextButton.addEventListener(
    "click",
    nextSong
);


/* =========================================================
   SIDE CONTROLS
========================================================= */

previousSide.addEventListener(
    "click",
    previousSong
);

nextSide.addEventListener(
    "click",
    nextSong
);


/* =========================================================
   SONG INFORMATION
========================================================= */

function updateSongInfo() {

    if (!playerReady)
        return;


    try {

        const data =
            player.getVideoData();


        if (
            data &&
            data.title
        ) {

            songTitle.textContent =
                data.title;

        }


        if (
            data &&
            data.author
        ) {

            songArtist.textContent =
                data.author;

        }


        if (
            data &&
            data.video_id
        ) {

            coverImage.src =
                "https://i.ytimg.com/vi/" +
                data.video_id +
                "/hqdefault.jpg";

        }

    }

    catch(error) {

        console.log(
            "Song metadata not ready."
        );

    }

}


/* =========================================================
   PROGRESS UPDATE
========================================================= */

function updateProgress() {

    if (
        !playerReady ||
        !player
    )
        return;


    try {

        const total =
            player.getDuration();

        const current =
            player.getCurrentTime();


        if (
            total &&
            total > 0
        ) {

            progress.value =
                (
                    current /
                    total
                ) * 100;


            currentTime.textContent =
                formatTime(
                    current
                );


            duration.textContent =
                formatTime(
                    total
                );

        }

    }

    catch(error) {

        // Player metadata may not be ready.

    }

}


setInterval(
    updateProgress,
    500
);


/* =========================================================
   SEEK
========================================================= */

progress.addEventListener(
    "input",
    function() {

        if (
            !playerReady ||
            !player
        )
            return;


        try {

            const total =
                player.getDuration();


            if (!total)
                return;


            const target =
                (
                    Number(
                        progress.value
                    ) / 100
                ) * total;


            player.seekTo(
                target,
                true
            );

        }

        catch(error) {

            console.error(
                error
            );

        }

    }
);


/* =========================================================
   TIME FORMAT
========================================================= */

function formatTime(seconds) {

    seconds =
        Math.floor(
            Number(seconds) || 0
        );


    const minutes =
        Math.floor(
            seconds / 60
        );


    const remaining =
        String(
            seconds % 60
        ).padStart(
            2,
            "0"
        );


    return (
        minutes +
        ":" +
        remaining
    );

}

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {


        /*
         * Don't hijack keyboard when
         * user is using an input.
         */

        if (
            event.target.tagName ===
            "INPUT"
        ) {
            return;
        }


        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();

            playButton.click();

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            previousSong();

        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            nextSong();

        }

    }
);

   LOAD YOUTUBE IFRAME API
========================================================= */

const youtubeScript =
    document.createElement(
        "script"
    );

youtubeScript.src =
    "https://www.youtube.com/iframe_api";

youtubeScript.async = true;

document.head.appendChild(
    youtubeScript
);
